<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>شطرنج أطلس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; user-select: none; }
body {
  margin: 0; padding: 8px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1e1e1e; color: #eee;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; overflow-x: hidden;
}
#topbar, #bottombar {
  width: min(95vw, 95vh, 600px);
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 4px; font-size: 15px; font-weight: 600;
}
#topbar { margin-bottom: 4px; }
#bottombar { margin-top: 4px; }
.player-info { display: flex; align-items: center; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #333; border: 2px solid #555; }
#oppTimer, #myTimer {
  background: #333; padding: 4px 12px; border-radius: 6px;
  font-family: monospace; font-size: 18px; letter-spacing: 1px; min-width: 72px; text-align: center; transition: 0.3s;
}
#oppTimer.low, #myTimer.low { background: #8b1e1e; color: #fff; }
#oppTimer.active, #myTimer.active { background: #2b6e2b; color: #fff; box-shadow: 0 0 10px rgba(43, 110, 43, 0.6); }
#board-container { position: relative; width: min(95vw, 95vh, 600px); aspect-ratio: 1; }
#board {
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  width: 100%; height: 100%;
  border-radius: 4px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.5);
  touch-action: none;
}
.square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
.light { background: #f0d9b5; }
.dark { background: #b58863; }
.square.selected { box-shadow: inset 0 0 0 4px #f7d84a; }
.square.valid::after {
  content: ''; position: absolute; width: 30%; height: 30%;
  border-radius: 50%; background: rgba(0,100,0,.55); pointer-events: none;
}
.square.capture::after {
  content: ''; position: absolute; inset: 5%; border-radius: 50%;
  border: 5px solid rgba(200,30,30,.8); pointer-events: none;
}
.piece {
  font-size: calc(min(95vw,95vh,600px) / 8 * 0.82); line-height: 1;
  pointer-events: none; z-index: 10;
}
.piece.w { color: #ffffff; -webkit-text-stroke: 1.2px #1a1a1a; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.piece.b { color: #1a1a1a; -webkit-text-stroke: 1px rgba(255,255,255,.35); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
#status { margin-top: 10px; padding: 6px 16px; font-size: 14px; color: #aaa; text-align: center; min-height: 20px; }
.drag-ghost {
  position: fixed; pointer-events: none; z-index: 1000;
  font-size: calc(min(95vw,95vh,600px) / 8 * 0.82);
  transform: translate(-50%, -50%);
}
.drag-ghost.w { color: #ffffff; -webkit-text-stroke: 1.2px #1a1a1a; }
.drag-ghost.b { color: #1a1a1a; -webkit-text-stroke: 1px rgba(255,255,255,.35); }

/* شاشة النهاية */
#end-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,30,30,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; }
#end-screen.show { display: flex; }
.end-title { font-size: 32px; font-weight: bold; margin-bottom: 30px; }
.end-title.win { color: #4caf50; }
.end-title.lose { color: #f44336; }
.end-players { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
.end-player { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.end-player img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #555; object-fit: cover; }
.end-player.winner img { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
.end-player .name { font-size: 18px; font-weight: bold; }
.end-player .result { font-size: 14px; color: #aaa; }
.vs { font-size: 24px; font-weight: bold; color: #ffd84a; }
</style>
</head>
<body>
<div id="topbar">
  <div class="player-info">
    <img id="oppAvatar" class="avatar" src="https://ui-avatars.com/api/?name=O&background=333&color=fff">
    <span id="oppName">الخصم</span>
  </div>
  <span id="oppTimer" class="timer">10:00</span>
</div>

<div id="board-container">
  <div id="board"></div>
  <div id="end-screen">
    <div id="end-title" class="end-title">فوز</div>
    <div class="end-players">
      <div id="p1-box" class="end-player">
        <img id="p1-img" src="">
        <div id="p1-name" class="name"></div>
        <div id="p1-res" class="result"></div>
      </div>
      <div class="vs">VS</div>
      <div id="p2-box" class="end-player">
        <img id="p2-img" src="">
        <div id="p2-name" class="name"></div>
        <div id="p2-res" class="result"></div>
      </div>
    </div>
  </div>
</div>

<div id="bottombar">
  <div class="player-info">
    <img id="myAvatar" class="avatar" src="https://ui-avatars.com/api/?name=M&background=333&color=fff">
    <span id="myName">أنا</span>
  </div>
  <span id="myTimer" class="timer">10:00</span>
</div>

<div id="status">جارٍ التحميل...</div>

<script>
(function(){
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#1e1e1e'); } catch(e){} }

if (typeof Chess === 'undefined') {
  document.getElementById('status').textContent = "فشل تحميل محرك الشطرنج، يرجى إغلاق التطبيق وفتحه من جديد.";
  document.getElementById('status').style.color = "red";
  return;
}

function parseParams(){
  var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp) {
    var p = sp.split('_');
    if (p.length === 3) return { mode: 'pvp', room: p[0], player: p[1].replace('p',''), color: p[2] };
  }
  var q = new URLSearchParams(location.search);
  return { 
    mode: q.get('mode') || 'pvp', 
    room: q.get('room'), 
    player: q.get('p') || '1', 
    color: q.get('color') || 'w',
    level: parseInt(q.get('level')) || 1
  };
}
var P = parseParams();
var isAI = P.mode === 'ai';
var myColor = isAI ? 'w' : P.color;
var oppColor = myColor === 'w' ? 'b' : 'w';
var myName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'لاعب';
var myPhoto = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.photo_url) || 'https://ui-avatars.com/api/?name=M&background=333&color=fff';
var oppName = isAI ? (P.level === 1 ? 'بوت (سهل)' : P.level === 2 ? 'بوت (متوسط)' : 'بوت (صعب)') : 'بانتظار الخصم...';
var oppPhoto = isAI ? 'https://cdn-icons-png.flaticon.com/512/4712/4712109.png' : 'https://ui-avatars.com/api/?name=O&background=333&color=fff';

var game = new Chess();
var selected = null, validTargets = [];
var myTime = 600000, oppTime = 600000;
var timerInterval = null, connected = false, gameOver = false;
var peer = null, conn = null;
var files = ['a','b','c','d','e','f','g','h'];
var SYM = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };

function el(id){ return document.getElementById(id); }
function formatTime(ms){ if(ms<0) ms=0; var s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateTimersUI(){
  el('myTimer').textContent = formatTime(myTime);
  el('oppTimer').textContent = formatTime(oppTime);
  el('myTimer').classList.toggle('low', myTime < 60000);
  el('oppTimer').classList.toggle('low', oppTime < 60000);
  
  if (!gameOver) {
    el('myTimer').classList.toggle('active', game.turn() === myColor);
    el('oppTimer').classList.toggle('active', game.turn() !== myColor);
  }
}

function renderBoard(){
  var b = el('board'); b.innerHTML = '';
  var fi = [0,1,2,3,4,5,6,7], ri = [7,6,5,4,3,2,1,0];
  if (myColor === 'b') { fi.reverse(); ri = [0,1,2,3,4,5,6,7]; }
  for (var r = 0; r < 8; r++) {
    for (var f = 0; f < 8; f++) {
      var fi0 = fi[f], ri0 = ri[r];
      var square = files[fi0] + (ri0 + 1);
      var isLight = (fi0 + ri0) % 2 === 1;
      var sq = document.createElement('div');
      sq.className = 'square ' + (isLight ? 'light' : 'dark');
      sq.dataset.square = square;
      var p = game.get(square);
      if (p) {
        var sp = document.createElement('span');
        sp.className = 'piece ' + p.color;
        sp.textContent = SYM[p.type];
        sq.appendChild(sp);
      }
      if (selected === square) sq.classList.add('selected');
      if (validTargets.indexOf(square) >= 0) sq.classList.add(p ? 'capture' : 'valid');
      b.appendChild(sq);
    }
  }
}

// --- السحب والإفلات ---
var isDragging = false, dragSquare = null, ghostEl = null;
var boardEl = el('board');

boardEl.addEventListener('pointerdown', function(e){
  if (gameOver || (!connected && !isAI) || game.turn() !== myColor) return;
  var sqEl = e.target.closest('.square');
  if (!sqEl) return;
  var square = sqEl.dataset.square;
  var piece = game.get(square);
  if (piece && piece.color === myColor) {
    isDragging = true; dragSquare = square; selected = square;
    validTargets = game.moves({ square: square, verbose: true }).map(function(m){ return m.to; });
    ghostEl = document.createElement('span');
    ghostEl.className = 'piece ' + piece.color + ' drag-ghost';
    ghostEl.textContent = SYM[piece.type];
    ghostEl.style.left = e.clientX + 'px'; ghostEl.style.top = e.clientY + 'px';
    document.body.appendChild(ghostEl);
    renderBoard();
  } else {
    selected = null; validTargets = []; renderBoard();
  }
});

document.addEventListener('pointermove', function(e){
  if (!isDragging || !ghostEl) return;
  ghostEl.style.left = e.clientX + 'px'; ghostEl.style.top = e.clientY + 'px';
});

document.addEventListener('pointerup', function(e){
  if (!isDragging) return;
  isDragging = false;
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  var targetSquare = null;
  var squares = document.querySelectorAll('.square');
  for (var i = 0; i < squares.length; i++) {
    var rect = squares[i].getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      targetSquare = squares[i].dataset.square; break;
    }
  }
  if (targetSquare && validTargets.indexOf(targetSquare) >= 0) {
    makeMove(dragSquare, targetSquare);
  } else { selected = null; validTargets = []; renderBoard(); }
});

// --- الأصوات الطبيعية المريحة (Web Audio API) ---
var audioCtx = null;
function playSound(type){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    
    if (type === 'start') {
       osc.type = 'sine';
       osc.frequency.setValueAtTime(440, audioCtx.currentTime);
       osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
       gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
       gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
       osc.connect(gain); gain.connect(audioCtx.destination);
       osc.start(); osc.stop(audioCtx.currentTime + 0.3);
       return;
    }

    // محاكاة صوت طقة الخشب الناعمة
    var bufferSize = audioCtx.sampleRate * 0.03; // 30ms
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    var noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 1000; // فلتر لتنعيم الصوت
    
    var noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(type === 'capture' ? 0.4 : 0.2, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
    
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    
    // طبقة الطقة العميقة
    osc.type = 'sine';
    osc.frequency.setValueAtTime(type === 'capture' ? 150 : 250, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(type === 'capture' ? 0.6 : 0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    noise.start();
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } catch(e){}
}

function send(msg){ if (conn && connected) { try { conn.send(msg); } catch(e){} } }

function makeMove(from, to, promotion){
  var moving = game.get(from);
  if(!moving) return false;
  var mv = { from: from, to: to };
  if (moving.type === 'p' && (to[1] === '8' || to[1] === '1')) mv.promotion = promotion || 'q';
  var res = game.move(mv);
  if (res) {
    selected = null; validTargets = []; renderBoard(); updateTimersUI(); lastTick = Date.now();
    playSound(res.captured ? 'capture' : 'move');
    checkEnd();
    if (isAI && !gameOver && game.turn() !== myColor) triggerAIMove();
    else if (!isAI) send({ type:'move', from: from, to: to, promotion: mv.promotion, remaining: myTime });
    return true;
  }
  return false;
}

function checkEnd(){
  if (!game.game_over()) return;
  var msg = '', winner = null;
  if (game.in_checkmate()) {
    winner = game.turn() === 'w' ? 'b' : 'w';
    msg = game.turn() === myColor ? 'كش مات — خسرت' : 'كش مات — فزت!';
  } else if (game.in_stalemate() || game.in_draw()) { msg = 'تعادل'; }
  endGame(msg, winner);
}

function endGame(reason, winnerColor){
  if (gameOver) return;
  gameOver = true; clearInterval(timerInterval);
  el('status').textContent = reason; playSound('start');
  
  var screen = el('end-screen'); screen.classList.add('show');
  var title = el('end-title');
  
  var p1Win = winnerColor === myColor;
  var p2Win = winnerColor && winnerColor !== myColor;
  
  if (p1Win) { title.textContent = 'أنت فزت! 🏆'; title.className = 'end-title win'; }
  else if (p2Win) { title.textContent = 'أنت خسرت 💔'; title.className = 'end-title lose'; }
  else { title.textContent = 'تعادل 🤝'; title.className = 'end-title'; }
  
  el('p1-img').src = myPhoto;
  el('p1-name').textContent = myName;
  el('p1-res').textContent = p1Win ? 'فوز' : (p2Win ? 'خسارة' : 'تعادل');
  
  el('p2-img').src = oppPhoto;
  el('p2-name').textContent = oppName;
  el('p2-res').textContent = p2Win ? 'فوز' : (p1Win ? 'خسارة' : 'تعادل');
  
  if (p1Win) el('p1-box').classList.add('winner');
  if (p2Win) el('p2-box').classList.add('winner');
}

var lastTick = Date.now();
function startTimers(){
  clearInterval(timerInterval);
  lastTick = Date.now();
  timerInterval = setInterval(function(){
    if (gameOver) return;
    var now = Date.now(); var delta = now - lastTick; lastTick = now;
    
    if (game.turn() === myColor) {
      myTime = Math.max(0, myTime - delta);
      if (myTime === 0) { updateTimersUI(); endGame('خسرت — نفد وقتك', myColor === 'w' ? 'b' : 'w'); if(!isAI) send({ type:'timeout', loser: myColor }); return; }
    } else {
      oppTime = Math.max(0, oppTime - delta);
      if (oppTime === 0) { updateTimersUI(); endGame('فزت! نفد وقت الخصم', myColor); if(!isAI) send({ type:'timeout', loser: oppColor }); return; }
    }
    updateTimersUI();
  }, 100);
  playSound('start');
}

// --- الذكاء الاصطناعي ---
var pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
function evaluateBoard(game) {
  var totalEval = 0; var board = game.board();
  for (var i = 0; i < 8; i++) {
    for (var j = 0; j < 8; j++) {
      var piece = board[i][j];
      if (piece) { var value = pieceValues[piece.type]; totalEval += (piece.color === 'w' ? value : -value); }
    }
  }
  return totalEval;
}

function minimax(game, depth, isMaximizing) {
  if (depth === 0 || game.game_over()) return evaluateBoard(game);
  var moves = game.moves();
  if (isMaximizing) {
    var maxEval = -Infinity;
    for (var i = 0; i < moves.length; i++) { 
      game.move(moves[i]); 
      var score = minimax(game, depth - 1, false); 
      game.undo(); 
      maxEval = Math.max(maxEval, score); 
    }
    return maxEval;
  } else {
    var minEval = Infinity;
    for (var i = 0; i < moves.length; i++) { 
      game.move(moves[i]); 
      var score = minimax(game, depth - 1, true); 
      game.undo(); 
      minEval = Math.min(minEval, score); 
    }
    return minEval;
  }
}

function triggerAIMove(){
  if (gameOver || game.turn() === myColor) return;
  el('status').textContent = 'البوت يفكر...';
  setTimeout(function(){
    var moves = game.moves({ verbose: true });
    if(moves.length === 0) return;
    var bestMove = null;
    if (P.level === 1) {
      var captures = moves.filter(function(m){ return m.captured; });
      bestMove = (captures.length > 0 && Math.random() > 0.5) ? captures[Math.floor(Math.random()*captures.length)] : moves[Math.floor(Math.random()*moves.length)];
    } else {
      var depth = P.level === 2 ? 2 : 3;
      var isMaximizing = game.turn() === 'w';
      var bestEval = isMaximizing ? -Infinity : Infinity;
      moves.sort(function() { return 0.5 - Math.random(); });
      for (var i = 0; i < moves.length; i++) {
        game.move(moves[i]); 
        var score = minimax(game, depth - 1, !isMaximizing); 
        game.undo();
        if (isMaximizing) { if (score > bestEval) { bestEval = score; bestMove = moves[i]; } }
        else { if (score < bestEval) { bestEval = score; bestMove = moves[i]; } }
      }
    }
    if (bestMove) { makeMove(bestMove.from, bestMove.to, bestMove.promotion); el('status').textContent = 'دورك'; }
  }, 600); // تأخير 600 مللي ثانية لتظهر حركة التايمر
}

// --- الاتصال ---
function handleMessage(msg){
  if (msg.type === 'hello') {
    oppName = msg.name || 'الخصم';
    oppPhoto = msg.photo || 'https://ui-avatars.com/api/?name=O&background=333&color=fff';
    el('oppName').textContent = oppName;
    el('oppAvatar').src = oppPhoto;
    el('status').textContent = 'اللعبة بدأت!';
    startTimers();
  } else if (msg.type === 'move') {
    var mv = { from: msg.from, to: msg.to };
    if (msg.promotion) mv.promotion = msg.promotion;
    var res = game.move(mv);
    if (res) {
      oppTime = msg.remaining;
      renderBoard(); updateTimersUI();
      playSound(res.captured ? 'capture' : 'move');
      checkEnd();
    }
  } else if (msg.type === 'timeout') {
    if (msg.loser === myColor) endGame('خسرت — نفد وقتك', myColor === 'w' ? 'b' : 'w');
    else endGame('فزت! نفد وقت الخصم', myColor);
  }
}

function setupConn(){
  conn.on('open', function(){
    connected = true;
    el('status').textContent = 'متصل! جارٍ بدء اللعبة...';
    send({ type:'hello', name: myName, photo: myPhoto });
  });
  conn.on('data', handleMessage);
  conn.on('close', function(){ connected = false; if (!gameOver) el('status').textContent = 'انقطع الاتصال بالخصم'; });
  conn.on('error', function(err) { el('status').textContent = 'خطأ بالاتصال: ' + err; el('status').style.color = 'red'; });
}

function initPeer(){
  if (typeof Peer === 'undefined') {
    el('status').textContent = 'فشل تحميل مكتبة الاتصال، جرب إعادة فتح اللعبة';
    el('status').style.color = 'red';
    return;
  }

  var cfg = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
  
  if (P.player === '1') {
    el('status').textContent = 'جارٍ إنشاء الغرفة...';
    peer = new Peer('chess-' + P.room + '-host', cfg);
    peer.on('open', function(){ el('status').textContent = 'بانتظار انضمام الصديق...'; });
    peer.on('connection', function(c){ conn = c; setupConn(); });
    peer.on('error', function(e){ 
      el('status').textContent = 'خطأ بالغرفة: ' + e.type; 
      el('status').style.color = 'red';
    });
  } else {
    el('status').textContent = 'جارٍ الاتصال بالغرفة...';
    peer = new Peer(cfg);
    peer.on('open', function(){ 
      conn = peer.connect('chess-' + P.room + '-host', { reliable: true }); 
      setupConn(); 
    });
    peer.on('error', function(e){ 
      el('status').textContent = 'خطأ بالاتصال: ' + e.type + ' — تأكد أن صاحب الغرفة فتح اللعبة'; 
      el('status').style.color = 'red';
    });
  }
}

el('myName').textContent = myName;

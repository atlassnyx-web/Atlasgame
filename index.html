<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ATLAS — الهروب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#e8eef5; font-family:'Cairo', Tahoma, sans-serif; touch-action:none; }
#game { position:absolute; inset:0; display:block; width:100%; height:100%; }

/* ============ HUD ============ */
#hud { position:absolute; inset:0; pointer-events:none; z-index:10; display:none; }
#hud.show { display:block; }

#crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
#crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,50,50,0.9); box-shadow:0 0 6px rgba(255,50,50,0.8); }
#crosshair::before { top:50%; left:0; width:100%; height:2px; transform:translateY(-50%); }
#crosshair::after { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }

#topInfo { position:absolute; top:14px; left:50%; transform:translateX(-50%); text-align:center; }
#topInfo .wave { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:900; letter-spacing:3px; color:#d42020; text-shadow:0 0 12px rgba(212,32,32,0.8); margin-bottom:5px; }
#topInfo .score { font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.5); }

#healthBox { position:absolute; bottom:20px; left:20px; width:200px; max-width:40vw; }
#healthBox .lbl { font-size:10px; font-weight:900; letter-spacing:2px; color:#8a1414; margin-bottom:5px; }
#healthBar { height:13px; background:rgba(0,0,0,0.7); border:1px solid rgba(139,20,20,0.6); border-radius:4px; overflow:hidden; }
#healthFill { height:100%; width:100%; background:linear-gradient(90deg,#8a1414,#d42020); transition:width 0.15s; box-shadow:0 0 12px rgba(212,32,32,0.7); }

#ammoBox { position:absolute; bottom:20px; right:20px; text-align:left; direction:ltr; }
#ammoBox .num { font-family:'Orbitron',sans-serif; font-size:38px; font-weight:900; color:#f5c518; line-height:1; text-shadow:0 0 16px rgba(245,197,24,0.7); }
#ammoBox .num small { font-size:18px; color:#8a8a8a; margin-left:3px; }
#ammoBox .lbl { font-size:10px; font-weight:900; letter-spacing:3px; color:#8a8a8a; margin-top:2px; text-align:right; }

#damageOverlay { position:absolute; inset:0; background:radial-gradient(circle at center, transparent 30%, rgba(180,0,0,0.7) 100%); opacity:0; pointer-events:none; transition:opacity 0.25s; z-index:9; }
#damageOverlay.flash { opacity:1; transition:opacity 0s; }

/* ============ Touch Controls ============ */
#touchControls { position:absolute; inset:0; z-index:20; display:none; }
#touchControls.show { display:block; }
#joystick { position:absolute; bottom:30px; left:30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.2); touch-action:none; }
#joystickBase { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:55px; height:55px; border-radius:50%; background:rgba(245,197,24,0.35); border:2px solid rgba(245,197,24,0.7); box-shadow:0 0 20px rgba(245,197,24,0.4); pointer-events:none; }
.touchBtn { position:absolute; width:75px; height:75px; border-radius:50%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25); color:#fff; font-family:'Cairo', sans-serif; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; touch-action:none; }
.touchBtn:active { background:rgba(245,197,24,0.25); border-color:rgba(245,197,24,0.7); transform:scale(0.95); }
#shootBtn { bottom:105px; right:25px; width:95px; height:95px; background:rgba(200,30,30,0.3); border-color:rgba(255,80,80,0.7); font-size:13px; }
#jumpBtn { bottom:25px; right:130px; }
#runBtn { bottom:115px; right:135px; width:65px; height:65px; font-size:10px; }

/* ============ Overlays ============ */
.overlay { position:absolute; inset:0; display:none; flex-direction:column; justify-content:center; align-items:center; background:radial-gradient(circle at center, rgba(20,0,0,0.95), rgba(0,0,0,1)); z-index:30; padding:24px; text-align:center; }
.overlay.show { display:flex; }

.title-horror { font-family:'Orbitron',sans-serif; font-size:60px; font-weight:900; letter-spacing:12px; color:#d42020; line-height:1; margin-bottom:6px; text-shadow:0 0 10px rgba(255,0,0,0.9), 0 0 25px rgba(255,0,0,0.5), 0 0 45px rgba(255,0,0,0.3); }
.subtitle-horror { font-size:14px; color:#8a1414; letter-spacing:14px; margin-bottom:40px; font-weight:900; }
.desc { max-width:340px; color:#a0a8b0; font-size:14px; line-height:2; margin-bottom:32px; }
.desc b { color:#d42020; }

.btn { font-family:'Cairo', sans-serif; padding:16px 52px; font-size:18px; font-weight:900; background:linear-gradient(180deg,#d42020,#8a1414); color:#fff; border:none; border-radius:8px; cursor:pointer; letter-spacing:2px; box-shadow:0 6px 0 #400808, 0 8px 24px rgba(212,32,32,0.5); transition:transform 0.1s, box-shadow 0.1s; margin:6px 0; }
.btn:active { transform:translateY(5px); box-shadow:0 1px 0 #400808; }

.gameOverTitle { font-family:'Orbitron',sans-serif; font-size:48px; font-weight:900; letter-spacing:8px; color:#d42020; line-height:1; margin-bottom:8px; text-shadow:0 0 20px rgba(255,0,0,0.9); }
.stats-block { display:flex; gap:36px; margin:24px 0 32px; }
.stat-item { text-align:center; }
.stat-item .lbl { font-size:10px; color:#8a8a8a; letter-spacing:2px; font-weight:900; margin-bottom:6px; }
.stat-item .val { font-family:'Orbitron',sans-serif; font-size:34px; font-weight:900; color:#f5c518; line-height:1; text-shadow:0 0 16px rgba(245,197,24,0.6); }
.stat-item .val.red { color:#d42020; text-shadow:0 0 16px rgba(212,32,32,0.7); }

#hint { position:absolute; bottom:50%; left:50%; transform:translate(-50%, 50%); color:#a0a8b0; font-size:14px; text-align:center; pointer-events:none; z-index:11; display:none; text-shadow:0 0 10px rgba(0,0,0,0.9); }
#hint.show { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="topInfo">
    <div class="wave" id="waveLabel">الموجة 1</div>
    <div class="score" id="scoreLabel">0</div>
  </div>
  <div id="healthBox">
    <div class="lbl">الصحة</div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div id="ammoBox">
    <div class="num" id="ammoNum">30<small>/∞</small></div>
    <div class="lbl">الرصاص</div>
  </div>
  <div id="damageOverlay"></div>
</div>

<div id="hint">اضغط على الشاشة للتحكم</div>

<div id="touchControls">
  <div id="joystick"><div id="joystickBase"></div></div>
  <div class="touchBtn" id="shootBtn">إطلاق</div>
  <div class="touchBtn" id="jumpBtn">قفز</div>
  <div class="touchBtn" id="runBtn">جري</div>
</div>

<div class="overlay show" id="startScreen">
  <div class="title-horror">ATLAS</div>
  <div class="subtitle-horror">الـــهـــروب</div>
  <div class="desc">
    أنت محبوس في مكان مظلم.<br>
    <b>الأشباح قادمة...</b><br>
    اقتل أكبر عدد ممكن قبل أن يمسكوك.
  </div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<div class="overlay" id="overScreen">
  <div class="gameOverTitle">انتهت اللعبة</div>
  <div class="stats-block">
    <div class="stat-item"><div class="lbl">أشباح</div><div class="val red" id="finalKills">0</div></div>
    <div class="stat-item"><div class="lbl">الموجات</div><div class="val" id="finalWave">1</div></div>
    <div class="stat-item"><div class="lbl">الوقت</div><div class="val" id="finalTime">0s</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<script>
/* ================================================================
   ATLAS — الهروب | لعبة FPS رعب بملف واحد
   ================================================================ */

// ==================== إعدادات ====================
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

// ==================== Audio ====================
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function beep(freq, type, dur, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const sfx = {
  shoot:    () => { beep(320,'square',0.06,0.06,90); beep(1400,'sine',0.04,0.04,400); },
  hitGhost: () => beep(200,'sawtooth',0.18,0.07,60),
  ghostDie: () => { beep(180,'sine',0.6,0.08,40); beep(90,'sawtooth',0.7,0.05,30); },
  jump:     () => beep(280,'sine',0.09,0.05,180),
  groan:    () => { beep(80+Math.random()*40,'sawtooth',1.2,0.05,50); beep(160,'sine',1.5,0.03,80); },
  wave:     () => { beep(120,'sawtooth',0.4,0.09,60); beep(180,'sawtooth',0.5,0.08,90); beep(240,'sine',0.6,0.07,120); },
  hit:      () => { beep(150,'sawtooth',0.2,0.08,60); },
  reload:   () => beep(600,'square',0.1,0.05,900),
  noAmmo:   () => beep(150,'square',0.08,0.05,100),
};

// ==================== Three.js setup ====================
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const pixelRatio = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.0 : 1.25);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 28);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);
camera.rotation.order = 'YXZ';

// ==================== Lighting ====================
scene.add(new THREE.AmbientLight(0x1a1a2a, 0.1));
scene.add(new THREE.HemisphereLight(0x1a1030, 0x000000, 0.15));

const flashlight = new THREE.SpotLight(0xfff0d0, 1.8, 25, Math.PI / 5.5, 0.45, 1.5);
flashlight.castShadow = false;
scene.add(flashlight);
scene.add(flashlight.target);

const redLight = new THREE.PointLight(0xd42020, 0.2, 15);
redLight.position.set(0, 3, -8);
scene.add(redLight);

// ==================== Materials ====================
const matWall = new THREE.MeshLambertMaterial({ color: 0x2a2420 });
const matWallDark = new THREE.MeshLambertMaterial({ color: 0x1a1510 });
const matFloor = new THREE.MeshLambertMaterial({ color: 0x151210 });
const matCeiling = new THREE.MeshLambertMaterial({ color: 0x0a0808 });
const matPillar = new THREE.MeshLambertMaterial({ color: 0x302820 });
const matBone = new THREE.MeshLambertMaterial({ color: 0xb0a890 });
const matBlood = new THREE.MeshLambertMaterial({ color: 0x5a0808 });

// ==================== Arena ====================
const ARENA = { w: 60, d: 60, h: 6 };
const halfW = ARENA.w / 2;
const halfD = ARENA.d / 2;
const wallT = 0.6;
const wallH = ARENA.h;

const wallGeo = new THREE.BoxGeometry(1, 1, 1);

// Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA.w, ARENA.d), matFloor);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Ceiling
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ARENA.w, ARENA.d), matCeiling);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ARENA.h;
scene.add(ceiling);

// Walls container
const mazeWalls = [];

function addWall(x, y, z, w, h, d, mat) {
  const m = new THREE.Mesh(wallGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(w, h, d);
  scene.add(m);
  if (h === wallH && mat !== matWall) {
    mazeWalls.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
  }
}

// Outer walls
addWall(-halfW, wallH/2, 0, wallT, wallH, ARENA.d, matWall);
addWall(halfW, wallH/2, 0, wallT, wallH, ARENA.d, matWall);
addWall(0, wallH/2, -halfD, ARENA.w, wallH, wallT, matWall);
addWall(0, wallH/2, halfD, ARENA.w, wallH, wallT, matWall);

// Inner maze walls
function addInner(x, z, w, d) {
  const m = new THREE.Mesh(wallGeo, matWallDark);
  m.position.set(x, wallH/2, z);
  m.scale.set(w, wallH, d);
  scene.add(m);
  mazeWalls.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
}
addInner(-12, -12, 8, 0.5);
addInner(12, -12, 8, 0.5);
addInner(-18, -18, 0.5, 8);
addInner(18, -18, 0.5, 8);
addInner(-18, 0, 0.5, 8);
addInner(18, 0, 0.5, 8);
addInner(-8, 6, 8, 0.5);
addInner(8, 6, 8, 0.5);
addInner(-18, 18, 0.5, 8);
addInner(18, 18, 0.5, 8);
addInner(-12, 12, 8, 0.5);
addInner(12, 12, 8, 0.5);
addInner(0, -8, 0.5, 6);
addInner(0, 8, 0.5, 6);

// Pillars
function addPillar(x, z) {
  const p = new THREE.Mesh(wallGeo, matPillar);
  p.position.set(x, wallH/2, z);
  p.scale.set(0.8, wallH, 0.8);
  scene.add(p);
  mazeWalls.push({ minX: x-0.4, maxX: x+0.4, minZ: z-0.4, maxZ: z+0.4 });
}
[[-6,-6],[6,-6],[-6,6],[6,6],[-15,-15],[15,-15],[-15,15],[15,15]].forEach(p => addPillar(p[0], p[1]));

// Decor
const skullGeo = new THREE.SphereGeometry(0.2, 6, 5);
const boneGeo = new THREE.BoxGeometry(0.08, 0.08, 0.4);
function addSkull(x, z) {
  const s = new THREE.Mesh(skullGeo, matBone);
  s.position.set(x, 0.2, z);
  s.scale.set(1, 0.85, 1.1);
  scene.add(s);
}
function addBlood(x, z) {
  const b = new THREE.Mesh(new THREE.CircleGeometry(0.5 + Math.random()*0.4, 8), matBlood);
  b.rotation.x = -Math.PI/2;
  b.position.set(x, 0.01, z);
  scene.add(b);
}
[[-16,-8],[-14,3],[-16,10],[-10,-14],[-4,-16],[10,-14],[14,-4],[16,8],[12,16],[4,16],[-8,14],[14,-14],[8,-8],[-8,8]].forEach((p,i) => {
  if (i % 2 === 0) addSkull(p[0], p[1]);
  else addBlood(p[0], p[1]);
});

// ==================== Player ====================
const player = {
  pos: new THREE.Vector3(0, 1.6, 0),
  vel: new THREE.Vector3(0, 0, 0),
  yaw: 0, pitch: 0,
  onGround: true,
  speed: 4.2, runSpeed: 7.0,
  jumpForce: 6.5, gravity: 18,
  height: 1.6, radius: 0.35,
  health: 100, maxHealth: 100,
  bob: 0,
};

// ==================== Input ====================
const input = {
  forward: false, backward: false, left: false, right: false,
  jump: false, run: false, shoot: false,
  mouseDX: 0, mouseDY: 0,
  locked: false,
  joyX: 0, joyY: 0, joyId: null, joyActive: false, joyStartX: 0, joyStartY: 0, joyMax: 55,
  lookId: null, lookX: 0, lookY: 0,
  touchJump: false, touchRun: false, touchShoot: false,
};

// Keyboard
const keyMap = { KeyW:'forward', ArrowUp:'forward', KeyS:'backward', ArrowDown:'backward', KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right', Space:'jump', ShiftLeft:'run', ShiftRight:'run' };
window.addEventListener('keydown', e => {
  if (e.code === 'Space') e.preventDefault();
  const a = keyMap[e.code];
  if (a) input[a] = true;
});
window.addEventListener('keyup', e => {
  const a = keyMap[e.code];
  if (a) input[a] = false;
});

// Mouse look (PC)
canvas.addEventListener('click', () => {
  if (!game.running) return;
  if (!IS_TOUCH && !input.locked) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  input.locked = document.pointerLockElement === canvas;
  document.getElementById('hint').classList.toggle('show', game.running && !input.locked && !IS_TOUCH);
});
document.addEventListener('mousemove', e => {
  if (!input.locked) return;
  input.mouseDX += e.movementX;
  input.mouseDY += e.movementY;
});
document.addEventListener('mousedown', e => { if (e.button === 0 && input.locked) input.shoot = true; });
document.addEventListener('mouseup', e => { if (e.button === 0) input.shoot = false; });

// Touch controls
const joystickEl = document.getElementById('joystick');
const joystickBaseEl = document.getElementById('joystickBase');

joystickEl.addEventListener('touchstart', e => {
  e.preventDefault();
  if (input.joyId !== null) return;
  const t = e.changedTouches[0];
  const rect = joystickEl.getBoundingClientRect();
  input.joyId = t.identifier;
  input.joyStartX = rect.left + rect.width/2;
  input.joyStartY = rect.top + rect.height/2;
  input.joyActive = true;
}, { passive: false });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === input.joyId) {
      let dx = t.clientX - input.joyStartX;
      let dy = t.clientY - input.joyStartY;
      const dist = Math.hypot(dx, dy);
      if (dist > input.joyMax) { dx = dx/dist*input.joyMax; dy = dy/dist*input.joyMax; }
      input.joyX = dx / input.joyMax;
      input.joyY = dy / input.joyMax;
      joystickBaseEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
    if (t.identifier === input.lookId) {
      const dx = t.clientX - input.lookX;
      const dy = t.clientY - input.lookY;
      input.mouseDX += dx * 1.8;
      input.mouseDY += dy * 1.8;
      input.lookX = t.clientX;
      input.lookY = t.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === input.joyId) {
      input.joyId = null;
      input.joyActive = false;
      input.joyX = 0; input.joyY = 0;
      joystickBaseEl.style.transform = 'translate(-50%,-50%)';
    }
    if (t.identifier === input.lookId) input.lookId = null;
  }
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  if (input.lookId !== null) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.target.closest('#joystick') || t.target.closest('.touchBtn')) continue;
    input.lookId = t.identifier;
    input.lookX = t.clientX;
    input.lookY = t.clientY;
    break;
  }
}, { passive: false });

function bindBtn(el, prop) {
  el.addEventListener('touchstart', e => { e.preventDefault(); input[prop] = true; }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); input[prop] = false; }, { passive: false });
  el.addEventListener('touchcancel', () => { input[prop] = false; });
}
bindBtn(document.getElementById('shootBtn'), 'touchShoot');
bindBtn(document.getElementById('jumpBtn'), 'touchJump');
bindBtn(document.getElementById('runBtn'), 'touchRun');

// ==================== Collision ====================
function collides(x, z) {
  const r = player.radius;
  if (x - r < -halfW + wallT/2 || x + r > halfW - wallT/2) return true;
  if (z - r < -halfD + wallT/2 || z + r > halfD - wallT/2) return true;
  for (let i = 0; i < mazeWalls.length; i++) {
    const w = mazeWalls[i];
    if (x + r > w.minX && x - r < w.maxX && z + r > w.minZ && z - r < w.maxZ) return true;
  }
  return false;
}

// ==================== Ghosts ====================
const ghosts = [];
const ghostHeadGeo = new THREE.SphereGeometry(0.55, 8, 6);
const ghostBodyGeo = new THREE.ConeGeometry(0.65, 1.4, 6);
const ghostEyeGeo = new THREE.SphereGeometry(0.1, 5, 4);
const ghostEyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

function makeGhostMat(color) {
  return new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.35, transparent: true, opacity: 0.75 });
}
const ghostMats = [makeGhostMat(0x8b1a2b), makeGhostMat(0x4a2a5a), makeGhostMat(0x2a3a5a)];

function spawnGhost(speed, hp, type) {
  const group = new THREE.Group();
  const head = new THREE.Mesh(ghostHeadGeo, ghostMats[type]);
  head.position.y = 1.2;
  group.add(head);
  const body = new THREE.Mesh(ghostBodyGeo, ghostMats[type]);
  body.position.y = 0.5;
  body.rotation.x = Math.PI;
  group.add(body);
  const eyeL = new THREE.Mesh(ghostEyeGeo, ghostEyeMat);
  eyeL.position.set(-0.2, 1.3, 0.42);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(ghostEyeGeo, ghostEyeMat);
  eyeR.position.set(0.2, 1.3, 0.42);
  group.add(eyeR);

  // Position away from player
  let x, z, tries = 0;
  do {
    const side = Math.floor(Math.random() * 4);
    const dist = 18 + Math.random() * 10;
    if (side === 0) { x = player.pos.x + dist; z = player.pos.z + (Math.random()-0.5)*30; }
    else if (side === 1) { x = player.pos.x - dist; z = player.pos.z + (Math.random()-0.5)*30; }
    else if (side === 2) { x = player.pos.x + (Math.random()-0.5)*30; z = player.pos.z + dist; }
    else { x = player.pos.x + (Math.random()-0.5)*30; z = player.pos.z - dist; }
    x = Math.max(-halfW+2, Math.min(halfW-2, x));
    z = Math.max(-halfD+2, Math.min(halfD-2, z));
    tries++;
  } while (collides(x, z) && tries < 20);

  group.position.set(x, 0, z);
  scene.add(group);

  ghosts.push({
    mesh: group, x, z,
    hp, maxHp: hp, speed, type,
    attackCD: 0, wobble: Math.random() * Math.PI * 2,
    life: 0, dying: false, dyingT: 0,
  });
}

function killGhost(g) {
  g.dying = true;
  g.dyingT = 0;
  game.kills++;
  game.score += 10;
  updateHUD();
  sfx.ghostDie();
  spawnParticles(g.x, 0.8, g.z, 0xa01030, 15);
}

function updateGhosts(dt) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    if (g.dying) {
      g.dyingT += dt;
      const t = g.dyingT / 0.7;
      g.mesh.scale.setScalar(Math.max(0.01, 1 - t));
      g.mesh.position.y += dt * 1.5;
      g.mesh.rotation.z += dt * 5;
      g.mesh.traverse(c => { if (c.material && c.material.opacity !== undefined) c.material.opacity = Math.max(0, 0.75 * (1-t)); });
      if (t >= 1) { scene.remove(g.mesh); ghosts.splice(i, 1); }
      continue;
    }
    g.life += dt;
    const dx = player.pos.x - g.x;
    const dz = player.pos.z - g.z;
    const dist = Math.hypot(dx, dz) || 1;

    if (dist > 1.2) {
      g.wobble += dt * 3;
      const wob = Math.sin(g.wobble) * 0.3;
      const ax = dx / dist, az = dz / dist;
      const rx = ax - az * wob;
      const rz = az + ax * wob;
      g.x += rx * g.speed * dt;
      g.z += rz * g.speed * dt;
      g.x = Math.max(-halfW+1, Math.min(halfW-1, g.x));
      g.z = Math.max(-halfD+1, Math.min(halfD-1, g.z));
    }
    g.mesh.position.x = g.x;
    g.mesh.position.z = g.z;
    g.mesh.position.y = 0.15 + Math.sin(g.life * 3) * 0.15;
    g.mesh.rotation.y = Math.atan2(dx, dz);

    g.attackCD -= dt;
    if (dist < 1.5 && g.attackCD <= 0) {
      damagePlayer(8);
      g.attackCD = 1.2;
      sfx.hit();
    }
    if (Math.random() < dt * 0.12) sfx.groan();
  }
}

// ==================== Waves ====================
let wave = 1;
let waveSpawned = 0, waveTotal = 0;
let waveSpawnT = 0, waveDelayT = 0;
let waveActive = false;

function startWave(n) {
  wave = n;
  game.wave = n;
  updateHUD();
  sfx.wave();
  waveTotal = Math.min(12, 3 + (n - 1) * 2);
  waveSpawned = 0;
  waveActive = true;
  waveSpawnT = 1.5;
}

function updateWaves(dt) {
  if (!waveActive) {
    if (waveDelayT > 0) {
      waveDelayT -= dt;
      if (waveDelayT <= 0) startWave(wave + 1);
    }
    return;
  }
  if (waveSpawned < waveTotal) {
    waveSpawnT -= dt;
    if (waveSpawnT <= 0) {
      const speed = Math.min(3.5, 1.2 + (wave - 1) * 0.15);
      const hp = 3 + (wave - 1) * 1;
      spawnGhost(speed, hp, Math.floor(Math.random() * 3));
      waveSpawned++;
      waveSpawnT = Math.max(0.4, 1.2 - wave * 0.05);
    }
  } else {
    const alive = ghosts.filter(g => !g.dying).length;
    if (alive === 0) {
      waveActive = false;
      waveDelayT = 3;
    }
  }
}

function resetGhosts() {
  ghosts.forEach(g => scene.remove(g.mesh));
  ghosts.length = 0;
  waveActive = false;
  waveDelayT = 0;
  waveSpawnT = 0;
}

// ==================== Bullets & Particles ====================
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.06, 4, 3);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });

const particles = [];
const particleGeo = new THREE.PlaneGeometry(0.12, 0.12);

function spawnParticles(x, y, z, color, count) {
  if (particles.length > 40) return;
  for (let i = 0; i < count && particles.length < 40; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    const a = Math.random() * Math.PI * 2;
    const e = (Math.random() - 0.3) * Math.PI;
    const v = 2 + Math.random() * 3;
    particles.push({
      mesh,
      vx: Math.cos(a) * Math.cos(e) * v,
      vy: Math.sin(e) * v + 1.5,
      vz: Math.sin(a) * Math.cos(e) * v,
      life: 0.7 + Math.random() * 0.4, maxLife: 1.1,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 8 * dt;
    p.vx *= 0.96; p.vz *= 0.96;
    p.life -= dt;
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    p.mesh.lookAt(camera.position);
    if (p.life <= 0) { scene.remove(p.mesh); p.mesh.material.dispose(); particles.splice(i, 1); }
  }
}

let ammo = 30, maxAmmo = 30, reloadT = 0, shootCD = 0;
const SHOOT_RATE = 0.14;

function shoot() {
  if (ammo <= 0) { sfx.noAmmo(); return; }
  ammo--;
  updateHUD();
  sfx.shoot();

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.4));

  const ghostMeshes = ghosts.filter(g => !g.dying).map(g => g.mesh);
  if (ghostMeshes.length > 0) {
    const ray = new THREE.Raycaster(origin, dir, 0, 50);
    const hits = ray.intersectObjects(ghostMeshes, true);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !ghosts.some(g => g.mesh === obj)) obj = obj.parent;
      const g = ghosts.find(g => g.mesh === obj);
      if (g && !g.dying) {
        g.hp--;
        spawnParticles(hits[0].point.x, hits[0].point.y, hits[0].point.z, 0xff2020, 8);
        sfx.hitGhost();
        if (g.hp <= 0) killGhost(g);
      }
    }
  }

  const bullet = new THREE.Mesh(bulletGeo, bulletMat);
  bullet.position.copy(origin);
  scene.add(bullet);
  bullets.push({ mesh: bullet, pos: origin.clone(), vel: dir.clone().multiplyScalar(60), life: 0.4 });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.pos.addScaledVector(b.vel, dt);
    b.mesh.position.copy(b.pos);
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }
}

function updateShooting(dt) {
  shootCD -= dt;
  if ((input.shoot || input.touchShoot) && shootCD <= 0) {
    shoot();
    shootCD = SHOOT_RATE;
  }
  if (ammo <= 0) {
    reloadT += dt;
    if (reloadT >= 1.2) {
      ammo = maxAmmo;
      reloadT = 0;
      updateHUD();
      sfx.reload();
    }
  } else reloadT = 0;
}

// ==================== Game state ====================
const game = {
  running: false, score: 0, wave: 1, kills: 0,
  startTime: 0,
};

// ==================== HUD ====================
function updateHUD() {
  document.getElementById('healthFill').style.width = Math.max(0, player.health / player.maxHealth * 100) + '%';
  document.getElementById('ammoNum').innerHTML = ammo + '<small>/∞</small>';
  document.getElementById('scoreLabel').textContent = game.score;
  document.getElementById('waveLabel').textContent = 'الموجة ' + game.wave;
}

function damagePlayer(amount) {
  player.health = Math.max(0, player.health - amount);
  updateHUD();
  const dmg = document.getElementById('damageOverlay');
  dmg.classList.add('flash');
  setTimeout(() => dmg.classList.remove('flash'), 60);
  // Screen shake
  canvas.style.transform = `translate(${(Math.random()-0.5)*8}px, ${(Math.random()-0.5)*8}px)`;
  setTimeout(() => canvas.style.transform = 'translate(0,0)', 80);
  if (player.health <= 0) endGame();
}

// ==================== Player update ====================
function updatePlayer(dt) {
  // Look
  player.yaw -= input.mouseDX * 0.0022;
  player.pitch -= input.mouseDY * 0.0022;
  const maxPitch = Math.PI / 2 - 0.05;
  player.pitch = Math.max(-maxPitch, Math.min(maxPitch, player.pitch));
  input.mouseDX = 0; input.mouseDY = 0;

  // Move input
  let mx = 0, mz = 0;
  if (input.forward) mz -= 1;
  if (input.backward) mz += 1;
  if (input.left) mx -= 1;
  if (input.right) mx += 1;
  mx += input.joyX;
  mz += input.joyY;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }

  const speed = (input.run || input.touchRun) ? player.runSpeed : player.speed;
  const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
  const wx = mx * cosY - mz * sinY;
  const wz = mx * sinY + mz * cosY;

  const dx = wx * speed * dt;
  const dz = wz * speed * dt;
  if (!collides(player.pos.x + dx, player.pos.z)) player.pos.x += dx;
  if (!collides(player.pos.x, player.pos.z + dz)) player.pos.z += dz;

  // Gravity/jump
  if ((input.jump || input.touchJump) && player.onGround) {
    player.vel.y = player.jumpForce;
    player.onGround = false;
    sfx.jump();
  }
  player.vel.y -= player.gravity * dt;
  player.pos.y += player.vel.y * dt;
  if (player.pos.y <= player.height) {
    player.pos.y = player.height;
    player.vel.y = 0;
    player.onGround = true;
  }

  // Head bob
  const moving = len > 0.1;
  if (moving && player.onGround) player.bob += dt * ((input.run || input.touchRun) ? 14 : 9);
  else player.bob *= (1 - dt * 5);
  const bobAmp = moving && player.onGround ? ((input.run || input.touchRun) ? 0.055 : 0.032) : 0;
  const bobY = Math.sin(player.bob) * bobAmp;

  // Apply camera
  camera.position.set(player.pos.x, player.pos.y + bobY, player.pos.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = 0;

  // Flashlight follows
  flashlight.position.copy(camera.position);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  flashlight.target.position.copy(camera.position).add(dir.multiplyScalar(5));
  flashlight.target.updateMatrixWorld();
}

// ==================== Game loop ====================
let lastTime = 0, animId = null;

function loop(now) {
  animId = requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (game.running) {
    // Sub-step for smoothness
    const steps = Math.min(3, Math.max(1, Math.round(dt / 0.016)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      updatePlayer(sdt);
      updateGhosts(sdt);
      updateWaves(sdt);
      updateBullets(sdt);
      updateParticles(sdt);
      updateShooting(sdt);
    }
  }

  renderer.render(scene, camera);
}

function startLoop() {
  if (animId !== null) return;
  lastTime = 0;
  animId = requestAnimationFrame(loop);
}

// ==================== Game control ====================
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  resetGhosts();
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  particles.forEach(p => scene.remove(p.mesh));
  particles.length = 0;

  ammo = maxAmmo; reloadT = 0; shootCD = 0;
  player.pos.set(0, 1.6, 0);
  player.vel.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0;
  player.health = player.maxHealth;
  player.onGround = true;
  player.bob = 0;

  Object.keys(input).forEach(k => { if (typeof input[k] === 'boolean') input[k] = false; });
  input.joyX = 0; input.joyY = 0; input.mouseDX = 0; input.mouseDY = 0;

  game.running = true;
  game.startTime = performance.now();
  game.score = 0;
  game.wave = 1;
  game.kills = 0;

  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('overScreen').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  if (IS_TOUCH) document.getElementById('touchControls').classList.add('show');

  updateHUD();
  startLoop();

  if (!IS_TOUCH) document.getElementById('hint').classList.add('show');

  setTimeout(() => { if (game.running) startWave(1); }, 1500);
}

function endGame() {
  game.running = false;
  document.getElementById('hud').classList.remove('show');
  document.getElementById('touchControls').classList.remove('show');
  document.getElementById('hint').classList.remove('show');
  if (document.pointerLockElement) document.exitPointerLock();

  const elapsed = Math.floor((performance.now() - game.startTime) / 1000);
  document.getElementById('finalKills').textContent = game.kills;
  document.getElementById('finalWave').textContent = game.wave;
  document.getElementById('finalTime').textContent = elapsed + 's';
  document.getElementById('overScreen').classList.add('show');
}

// ==================== Buttons ====================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ==================== Resize ====================
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ==================== Ambient sound ====================
let ambientOsc = null;
function startAmbient() {
  if (!audioCtx || ambientOsc) return;
  try {
    ambientOsc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    ambientOsc.type = 'sine';
    ambientOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
    g.gain.setValueAtTime(0.02, audioCtx.currentTime);
    ambientOsc.connect(g); g.connect(audioCtx.destination);
    ambientOsc.start();
  } catch(e) {}
}

// Start ambient when game starts
const _origStartGame = startGame;
startGame = function() {
  _origStartGame();
  startAmbient();
};

// ==================== Prevent defaults ====================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

// ==================== Init ====================
updateHUD();
startLoop();
console.log('✅ ATLAS — اللعبة جاهزة');
</script>

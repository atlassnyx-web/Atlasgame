<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>الثقب الأسود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#050510; color:#fff; font-family:'Cairo', Tahoma, sans-serif; touch-action:none; cursor:none; }
#game { position:absolute; inset:0; display:block; width:100%; height:100%; }

/* Vignette */
#vignette { position:absolute; inset:0; pointer-events:none; z-index:8; background:radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.75) 100%); }

/* HUD */
#hud { position:absolute; inset:0; pointer-events:none; z-index:10; display:none; }
#hud.show { display:block; }

#topInfo {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  text-align:center;
  display:flex; gap:14px;
}
.stat {
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(150,100,255,0.5);
  border-radius:12px;
  padding:8px 16px;
  text-align:center;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(120,60,220,0.3);
}
.stat .lbl { font-size:10px; color:#a89ec4; font-weight:900; letter-spacing:2px; }
.stat .val {
  font-family:'Orbitron', sans-serif;
  font-size:24px; font-weight:900; color:#fff;
  line-height:1; margin-top:2px;
  text-shadow:0 0 10px rgba(160,100,255,0.8);
}
.stat .val.gold { color:#f5c518; text-shadow:0 0 12px rgba(245,197,24,0.7); }
.stat .val.red { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,0.7); }

/* Time bar */
#timeBar {
  position:absolute; top:80px; left:50%; transform:translateX(-50%);
  width:min(340px, 60vw); height:8px;
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(150,100,255,0.4);
  border-radius:6px;
  overflow:hidden;
}
#timeFill {
  height:100%; width:100%;
  background:linear-gradient(90deg, #a855f7, #7c3aed);
  transition:width 0.1s linear;
  box-shadow:0 0 12px rgba(168,85,247,0.7);
}
#timeBar.warn #timeFill { background:linear-gradient(90deg, #ef4444, #c41010); box-shadow:0 0 12px rgba(239,68,68,0.7); }

/* Size indicator (bottom left) */
#sizeBox {
  position:absolute; bottom:24px; left:24px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(150,100,255,0.4);
  border-radius:12px;
  padding:10px 16px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#sizeBox .lbl { font-size:10px; color:#a89ec4; font-weight:900; letter-spacing:2px; }
#sizeBox .val {
  font-family:'Orbitron', sans-serif;
  font-size:22px; font-weight:900; color:#a855f7;
  line-height:1;
  text-shadow:0 0 12px rgba(168,85,247,0.8);
}

/* Grow banner */
#growBanner {
  position:absolute; top:35%; left:50%; transform:translate(-50%, -50%);
  font-family:'Orbitron', sans-serif;
  font-size:52px; font-weight:900;
  color:#a855f7;
  text-shadow: 0 0 20px rgba(168,85,247,1), 0 0 40px rgba(168,85,247,0.6);
  opacity:0; pointer-events:none;
  z-index:11; letter-spacing:4px;
}
#growBanner.show { animation: growPop 1s ease-out; }
@keyframes growPop {
  0% { opacity:0; transform:translate(-50%, -50%) scale(0.5); }
  20% { opacity:1; transform:translate(-50%, -50%) scale(1.2); }
  80% { opacity:1; transform:translate(-50%, -50%) scale(1); }
  100% { opacity:0; transform:translate(-50%, -50%) scale(1.4); }
}

/* Eat popup */
.eatPopup {
  position:absolute;
  font-family:'Orbitron', sans-serif;
  font-size:20px; font-weight:900;
  color:#f5c518;
  text-shadow:0 0 10px rgba(245,197,24,0.9);
  pointer-events:none;
  z-index:9;
  animation: eatFloat 0.7s ease-out forwards;
}
@keyframes eatFloat {
  from { opacity:1; transform:translateY(0); }
  to { opacity:0; transform:translateY(-50px); }
}

/* Timer running low */
#lowTimeFlash {
  position:absolute; inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(200,0,0,0.5) 100%);
  opacity:0; pointer-events:none; z-index:8;
}
#lowTimeFlash.show { animation: lowFlash 0.6s infinite; }
@keyframes lowFlash {
  0%,100% { opacity:0; }
  50% { opacity:0.6; }
}

/* Overlays */
.overlay {
  position:absolute; inset:0;
  display:none; flex-direction:column;
  justify-content:center; align-items:center;
  background:radial-gradient(circle at center, rgba(20,5,40,0.95), rgba(0,0,0,0.99));
  z-index:30; padding:24px; text-align:center; overflow-y:auto;
}
.overlay.show { display:flex; }

.title-main {
  font-family:'Orbitron', sans-serif;
  font-size:64px; font-weight:900; letter-spacing:8px;
  line-height:1; margin-bottom:6px;
  background:linear-gradient(180deg, #c084fc 0%, #7c3aed 50%, #4c1d95 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 0 18px rgba(168,85,247,0.85)) drop-shadow(0 0 36px rgba(168,85,247,0.4));
  animation: pulse 2.6s ease-in-out infinite alternate;
}
@keyframes pulse {
  from { filter: drop-shadow(0 0 12px rgba(168,85,247,0.6)) drop-shadow(0 0 24px rgba(168,85,247,0.3)); }
  to   { filter: drop-shadow(0 0 22px rgba(168,85,247,1)) drop-shadow(0 0 44px rgba(168,85,247,0.5)); }
}
.subtitle { font-size:13px; color:#a89ec4; letter-spacing:12px; margin-bottom:36px; font-weight:900; }

.desc { max-width:400px; color:#c4b8d4; font-size:14px; line-height:2; margin-bottom:28px; }
.desc b { color:#c084fc; }

.btn {
  font-family:'Cairo', sans-serif;
  padding:16px 52px; font-size:18px; font-weight:900;
  background:linear-gradient(180deg, #a855f7, #6d28d9);
  color:#fff; border:none; border-radius:14px;
  cursor:pointer; letter-spacing:1.5px;
  box-shadow: 0 6px 0 #3b0764, 0 10px 30px rgba(168,85,247,0.5);
  transition:transform 0.1s, box-shadow 0.1s;
  margin:6px 0;
}
.btn:active { transform:translateY(5px); box-shadow:0 1px 0 #3b0764; }

.final-title {
  font-family:'Orbitron', sans-serif;
  font-size:38px; font-weight:900; letter-spacing:6px;
  color:#c084fc; line-height:1; margin-bottom:8px;
  text-shadow:0 0 20px rgba(192,132,252,0.7);
}
.final-block {
  display:flex; gap:34px; margin:22px 0 28px;
}
.final-block .item { text-align:center; }
.final-block .lbl { font-size:10px; color:#a89ec4; font-weight:900; letter-spacing:2px; margin-bottom:6px; }
.final-block .val {
  font-family:'Orbitron', sans-serif;
  font-size:44px; font-weight:900; color:#f5c518;
  line-height:1; text-shadow:0 0 18px rgba(245,197,24,0.6);
}
.final-block .val.small { font-size:28px; color:#4ade80; text-shadow:0 0 14px rgba(74,222,128,0.5); }

.new-record {
  font-family:'Cairo', sans-serif;
  font-size:14px; font-weight:900; color:#4ade80;
  letter-spacing:2px; margin-bottom:12px;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

/* Rotate warning */
#rotateMsg {
  position:fixed; inset:0; z-index:9999;
  display:none; flex-direction:column;
  justify-content:center; align-items:center;
  background:#050510; color:#fff; text-align:center; padding:20px;
}
#rotateMsg.show { display:flex; }
#rotateMsg .icon { font-size:80px; margin-bottom:20px; animation:rot 2s ease-in-out infinite; color:#a855f7; }
@keyframes rot { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(90deg); } }
#rotateMsg .txt { font-size:18px; font-weight:900; color:#c084fc; letter-spacing:2px; }
#rotateMsg .sub { font-size:13px; color:#a89ec4; margin-top:10px; }
@media (orientation: portrait) { #rotateMsg.show { display:flex; } }
</style>
</head>
<body>

<div id="rotateMsg">
  <div class="icon">🕳️</div>
  <div class="txt">أدِر جهازك بالعرض</div>
  <div class="sub">اللعبة تحتاج الوضع الأفقي</div>
</div>

<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="lowTimeFlash"></div>

<div id="hud">
  <div id="topInfo">
    <div class="stat"><div class="lbl">النقاط</div><div class="val gold" id="scoreVal">0</div></div>
    <div class="stat"><div class="lbl">الوقت</div><div class="val" id="timeVal">90</div></div>
  </div>
  <div id="timeBar"><div id="timeFill"></div></div>
  <div id="sizeBox">
    <div class="lbl">حجمك</div>
    <div class="val" id="sizeVal">1.0</div>
  </div>
</div>

<div id="growBanner"></div>

<div class="overlay show" id="startScreen">
  <div class="title-main">الثقب الأسود</div>
  <div class="subtitle">الـــبـــلـــع</div>
  <div class="desc">
    أنت ثقب أسود في مدينة<br>
    <b>تحرك</b> لتأكل كل شي — سيارات، أشجار، بنايات<br>
    <b>كل ما تأكل أكثر، تكبر أكثر</b><br>
    ⏱️ عندك <b>90 ثانية</b> — سجّل أعلى نتيجة
  </div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<div class="overlay" id="overScreen">
  <div class="final-title">انتهى الوقت!</div>
  <div class="new-record" id="newRecord" style="display:none;">🏆 رقم قياسي جديد!</div>
  <div class="final-block">
    <div class="item"><div class="lbl">النقاط</div><div class="val" id="finalScore">0</div></div>
    <div class="item"><div class="lbl">أكبر حجم</div><div class="val small" id="finalSize">1.0</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<script>
/* ==========================================================
   الثقب الأسود — Black Hole City
   ========================================================== */

const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ============ Telegram ============
const tg = window.Telegram?.WebApp;
if (tg) {
  try { tg.expand(); tg.ready(); tg.setHeaderColor('#050510'); tg.setBackgroundColor('#050510'); } catch(e){}
}

// ============ Audio ============
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, type, dur, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bs = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(freq || 1000, t);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

const sfx = {
  eatSmall: () => {
    tone(500, 'sine', 0.06, 0.08, 250);
    noise(0.04, 0.05, 800);
  },
  eatBig: () => {
    tone(280, 'sine', 0.15, 0.12, 100);
    noise(0.15, 0.15, 500);
    tone(180, 'triangle', 0.2, 0.08, 60);
  },
  grow: () => {
    tone(400, 'sine', 0.15, 0.1, 800);
    setTimeout(() => tone(600, 'sine', 0.15, 0.1, 1000), 80);
    setTimeout(() => tone(900, 'sine', 0.2, 0.1, 1300), 160);
  },
  tick: () => {
    tone(1200, 'square', 0.03, 0.04);
  },
  end: () => {
    tone(600, 'sawtooth', 0.4, 0.15, 200);
    tone(400, 'sawtooth', 0.5, 0.12, 100);
    setTimeout(() => tone(200, 'sine', 0.8, 0.15, 60), 200);
  },
  suction: () => {
    noise(0.08, 0.03, 300);
  }
};

// ============ Scene Setup ============
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: false,
  powerPreference: 'high-performance',
  alpha: false
});
const pixelRatio = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 0.9 : 1.2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050510, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0820);
scene.fog = new THREE.Fog(0x0a0820, 45, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);

// ============ Lighting ============
scene.add(new THREE.AmbientLight(0x8080a0, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(30, 60, 20);
scene.add(dirLight);

// Purple accent light
const purpleLight = new THREE.PointLight(0xa855f7, 1.2, 40);
scene.add(purpleLight);

// ============ World Size ============
const WORLD = { size: 90 };  // 180x180 ground

// ============ Ground ============
function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  // Asphalt base
  g.fillStyle = '#2a2a38';
  g.fillRect(0, 0, 1024, 1024);
  // Random patches
  for (let i = 0; i < 400; i++) {
    const v = 30 + Math.random() * 20;
    g.fillStyle = `rgba(${v}, ${v}, ${v+10}, ${0.3 + Math.random() * 0.3})`;
    g.fillRect(Math.random() * 1024, Math.random() * 1024, 20 + Math.random() * 60, 20 + Math.random() * 60);
  }
  // Roads grid
  g.strokeStyle = '#1a1a26';
  g.lineWidth = 18;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * 256, 0); g.lineTo(i * 256, 1024); g.stroke();
    g.beginPath(); g.moveTo(0, i * 256); g.lineTo(1024, i * 256); g.stroke();
  }
  // Yellow road lines
  g.strokeStyle = '#d4a017';
  g.lineWidth = 3;
  g.setLineDash([30, 30]);
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(i * 256, 0); g.lineTo(i * 256, 1024); g.stroke();
    g.beginPath(); g.moveTo(0, i * 256); g.lineTo(1024, i * 256); g.stroke();
  }
  g.setLineDash([]);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}

const groundGeo = new THREE.PlaneGeometry(WORLD.size * 2, WORLD.size * 2);
const groundMat = new THREE.MeshLambertMaterial({ map: makeGroundTexture() });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Grid lines (subtle)
const grid = new THREE.GridHelper(WORLD.size * 2, 30, 0x3a3050, 0x1a1530);
grid.position.y = 0.02;
scene.add(grid);

// ============ Black Hole ============
const blackHoleGroup = new THREE.Group();
scene.add(blackHoleGroup);

// Core sphere
const coreGeo = new THREE.SphereGeometry(1, 24, 20);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const core = new THREE.Mesh(coreGeo, coreMat);
blackHoleGroup.add(core);

// Accretion disk ring 1
const ringGeo = new THREE.TorusGeometry(1.4, 0.12, 8, 40);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.9 });
const ring1 = new THREE.Mesh(ringGeo, ringMat);
ring1.rotation.x = Math.PI / 2;
blackHoleGroup.add(ring1);

// Accretion disk ring 2 (bigger, tilted)
const ringGeo2 = new THREE.TorusGeometry(1.9, 0.08, 8, 40);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.7 });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.x = Math.PI / 2.2;
ring2.rotation.z = 0.5;
blackHoleGroup.add(ring2);

// Outer glow
const glowGeo = new THREE.SphereGeometry(1.4, 16, 12);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x7c3aed, transparent: true, opacity: 0.25,
  side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
});
const glow = new THREE.Mesh(glowGeo, glowMat);
blackHoleGroup.add(glow);

// ============ Particle System (suction swirl) ============
const PARTICLE_COUNT = 60;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xc084fc, size: 0.35, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// Particle data (each has angle, radius, height, speed)
const particleData = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particleData.push({
    angle: Math.random() * Math.PI * 2,
    radius: 1.5 + Math.random() * 3,
    height: (Math.random() - 0.5) * 1.5,
    speed: 1.5 + Math.random() * 2.5,
    spinIn: 0.2 + Math.random() * 0.4,
  });
}

// ============ Objects (city) ============
const objects = [];
const MAX_OBJECTS = 70;

// Shared geometries
const geos = {
  buildingBox: new THREE.BoxGeometry(1, 1, 1),
  carBody: new THREE.BoxGeometry(1, 0.6, 1),
  carCabin: new THREE.BoxGeometry(0.6, 0.5, 0.5),
  treeTrunk: new THREE.CylinderGeometry(0.15, 0.2, 1, 6),
  treeCrown: new THREE.ConeGeometry(0.9, 1.6, 8),
  person: new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.15, 0.4, 4, 6) : new THREE.CylinderGeometry(0.15, 0.15, 0.7, 6),
  cone: new THREE.ConeGeometry(0.4, 0.8, 8),
  boxSmall: new THREE.BoxGeometry(0.8, 0.8, 0.8),
  bush: new THREE.SphereGeometry(0.5, 8, 6),
};

// Shared materials
const mats = {
  building: [0x5a5260, 0x6a6270, 0x504a5a, 0x705a62, 0x60525a].map(c =>
    new THREE.MeshLambertMaterial({ color: c })),
  car: [0xef4444, 0x3b82f6, 0xf5c518, 0x22c55e, 0xec4899].map(c =>
    new THREE.MeshLambertMaterial({ color: c })),
  carGlass: new THREE.MeshLambertMaterial({ color: 0x2a2a3a }),
  tree: new THREE.MeshLambertMaterial({ color: 0x3a6a2a }),
  trunk: new THREE.MeshLambertMaterial({ color: 0x4a3020 }),
  person: [0xef4444, 0x3b82f6, 0xf5c518, 0x22c55e].map(c =>
    new THREE.MeshLambertMaterial({ color: c })),
  cone: new THREE.MeshLambertMaterial({ color: 0xff6600 }),
  boxSmall: new THREE.MeshLambertMaterial({ color: 0x8a7a6a }),
  bush: new THREE.MeshLambertMaterial({ color: 0x4a7a3a }),
};

// Tier info: { tier, size, mass, points }
// tier 1: tiny (people, cones, boxes) - size 0.4
// tier 2: small (trees, cars) - size 0.9
// tier 3: medium (big cars, small buildings) - size 1.6
// tier 4: large (big buildings) - size 2.8
// tier 5: huge (skyscrapers) - size 4.5

function createRandomObject() {
  const tierWeights = [0.4, 0.3, 0.15, 0.1, 0.05]; // tier 1 most common
  let tier = 1;
  const r = Math.random();
  let acc = 0;
  for (let i = 0; i < tierWeights.length; i++) {
    acc += tierWeights[i];
    if (r < acc) { tier = i + 1; break; }
  }

  const group = new THREE.Group();
  let size, mass, points;

  if (tier === 1) {
    // Small: cone, box, person, bush
    const type = Math.floor(Math.random() * 4);
    if (type === 0) {
      const m = new THREE.Mesh(geos.cone, mats.cone);
      m.position.y = 0.4;
      group.add(m);
    } else if (type === 1) {
      const m = new THREE.Mesh(geos.boxSmall, mats.boxSmall);
      m.position.y = 0.4;
      group.add(m);
    } else if (type === 2) {
      const m = new THREE.Mesh(geos.person, mats.person[Math.floor(Math.random() * 4)]);
      m.position.y = 0.45;
      group.add(m);
    } else {
      const m = new THREE.Mesh(geos.bush, mats.bush);
      m.position.y = 0.4;
      group.add(m);
    }
    size = 0.5;
    mass = 4;
    points = 10;
  } else if (tier === 2) {
    // Trees and small cars
    if (Math.random() < 0.5) {
      const trunk = new THREE.Mesh(geos.treeTrunk, mats.trunk);
      trunk.position.y = 0.5; trunk.scale.y = 1.0;
      group.add(trunk);
      const crown = new THREE.Mesh(geos.treeCrown, mats.tree);
      crown.position.y = 1.4;
      group.add(crown);
      size = 0.9;
      mass = 12;
      points = 25;
    } else {
      const body = new THREE.Mesh(geos.carBody, mats.car[Math.floor(Math.random() * 5)]);
      body.position.y = 0.3; body.scale.set(1.8, 0.7, 1);
      group.add(body);
      const cabin = new THREE.Mesh(geos.carCabin, mats.carGlass);
      cabin.position.set(-0.1, 0.7, 0); cabin.scale.set(1, 1, 1);
      group.add(cabin);
      size = 1.1;
      mass = 15;
      points = 30;
    }
  } else if (tier === 3) {
    // Bigger cars / small buildings
    if (Math.random() < 0.5) {
      const body = new THREE.Mesh(geos.carBody, mats.car[Math.floor(Math.random() * 5)]);
      body.position.y = 0.5; body.scale.set(3.5, 1, 1.8);
      group.add(body);
      const cabin = new THREE.Mesh(geos.carCabin, mats.carGlass);
      cabin.position.set(-0.3, 1.3, 0); cabin.scale.set(1.6, 0.9, 0.8);
      group.add(cabin);
      size = 1.8;
      mass = 35;
      points = 60;
    } else {
      const w = 1.5 + Math.random() * 0.8;
      const h = 2.5 + Math.random() * 1;
      const d = 1.5 + Math.random() * 0.8;
      const b = new THREE.Mesh(geos.buildingBox, mats.building[Math.floor(Math.random() * mats.building.length)]);
      b.position.y = h / 2; b.scale.set(w, h, d);
      group.add(b);
      size = 2.0;
      mass = 45;
      points = 80;
    }
  } else if (tier === 4) {
    // Big buildings
    const w = 2.5 + Math.random() * 1.5;
    const h = 5 + Math.random() * 3;
    const d = 2.5 + Math.random() * 1.5;
    const b = new THREE.Mesh(geos.buildingBox, mats.building[Math.floor(Math.random() * mats.building.length)]);
    b.position.y = h / 2; b.scale.set(w, h, d);
    group.add(b);
    size = 3.2;
    mass = 110;
    points = 200;
  } else {
    // Skyscraper
    const w = 4 + Math.random() * 2;
    const h = 10 + Math.random() * 5;
    const d = 4 + Math.random() * 2;
    const b = new THREE.Mesh(geos.buildingBox, mats.building[Math.floor(Math.random() * mats.building.length)]);
    b.position.y = h / 2; b.scale.set(w, h, d);
    group.add(b);
    size = 5;
    mass = 280;
    points = 500;
  }

  // Random position (away from player start)
  let x, z, tries = 0;
  do {
    x = (Math.random() - 0.5) * WORLD.size * 1.8;
    z = (Math.random() - 0.5) * WORLD.size * 1.8;
    tries++;
  } while (Math.sqrt(x*x + z*z) < 10 && tries < 20);

  group.position.set(x, 0, z);
  // Random rotation
  group.rotation.y = Math.random() * Math.PI * 2;

  scene.add(group);

  return {
    mesh: group,
    x, z,
    size, mass, points, tier,
    vy: 0,
    spin: 0,
    spinning: false,
    eaten: false,
  };
}

// Spawn initial objects
for (let i = 0; i < MAX_OBJECTS; i++) {
  objects.push(createRandomObject());
}

// ============ Player State ============
const player = {
  x: 0, z: 0,
  vx: 0, vz: 0,
  size: 0.7,
  mass: 8,
  speed: 14,
  maxSize: 10,
};

// ============ Game State ============
const game = {
  mode: 'menu',
  score: 0,
  timeLeft: 90,
  maxSizeReached: 0.7,
  best: 0,
  // Input
  moveX: 0,
  moveY: 0,
  // Joystick

  joyCenterX: 0,
  joyCenterY: 0,
  joyCurX: 0,

  // Keyboard
  keys: {},

};

try {

} catch(e){}

// ============ Input ============
const canvasEl = document.getElementById('game');

// Keyboard
window.addEventListener('keydown', e => {
  game.keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  game.keys[e.code] = false;
});

// Touch joystick (floating — appears where you touch)
canvasEl.addEventListener('touchstart', e => {
  if (game.mode !== 'playing') return;
  e.preventDefault();
  if (game.joyId !== null) return;
  const t = e.changedTouches[0];
  game.joyId = t.identifier;
  game.joyCenterX = t.clientX;
  game.joyCenterY = t.clientY;
  game.joyCurX = t.clientX;
  game.joyCurY = t.clientY;
  game.joyActive = true;
}, { passive: false });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === game.joyId) {
      let dx = t.clientX - game.joyCenterX;
      let dy = t.clientY - game.joyCenterY;
      const dist = Math.hypot(dx, dy);
      if (dist > game.joyMax) {
        dx = dx / dist * game.joyMax;
        dy = dy / dist * game.joyMax;
      }
      game.joyCurX = game.joyCenterX + dx;
      game.joyCurY = game.joyCenterY + dy;
      game.moveX = dx / game.joyMax;
      game.moveY = dy / game.joyMax;
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === game.joyId) {
      game.joyId = null;
      game.joyActive = false;
      game.moveX = 0;
      game.moveY = 0;
    }
  }
}, { passive: false });

window.addEventListener('touchcancel', () => {
  game.joyId = null;
  game.joyActive = false;
  game.moveX = 0;
  game.moveY = 0;
});

// Mouse
let mouseDown = false;
canvasEl.addEventListener('mousedown', e => {
  if (game.mode !== 'playing') return;
  mouseDown = true;
  game.joyCenterX = e.clientX;
  game.joyCenterY = e.clientY;
  game.joyCurX = e.clientX;
  game.joyCurY = e.clientY;
  game.joyActive = true;
});
window.addEventListener('mousemove', e => {
  if (!mouseDown || game.mode !== 'playing') return;
  let dx = e.clientX - game.joyCenterX;
  let dy = e.clientY - game.joyCenterY;
  const dist = Math.hypot(dx, dy);
  if (dist > game.joyMax) {
    dx = dx / dist * game.joyMax;
    dy = dy / dist * game.joyMax;
  }
  game.joyCurX = game.joyCenterX + dx;
  game.joyCurY = game.joyCenterY + dy;
  game.moveX = dx / game.joyMax;
  game.moveY = dy / game.joyMax;
});
window.addEventListener('mouseup', () => {
  mouseDown = false;
  game.joyActive = false;
  game.moveX = 0;
  game.moveY = 0;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ Camera Follow ============
const cameraOffset = { x: 0, y: 24, z: 20 };

function updateCamera(dt) {
  // Camera pulls back as player grows
  const camScale = 1 + (player.size - 0.7) * 0.15;
  const targetX = player.x;
  const targetY = 24 * camScale;
  const targetZ = player.z + 20 * camScale;

  // Smooth follow
  camera.position.x += (targetX - camera.position.x) * Math.min(1, dt * 4);
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 4);
  camera.position.z += (targetZ - camera.position.z) * Math.min(1, dt * 4);

  // Look at player (slightly ahead)
  camera.lookAt(player.x, 0, player.z + 3);
}

// ============ Particle Update ============
function updateParticles(dt) {
  const pos = particleGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = particleData[i];
    p.angle += p.speed * dt;
    p.radius -= p.spinIn * dt;
    if (p.radius < 0.4) {
      p.radius = 1.5 + Math.random() * 3;
      p.angle = Math.random() * Math.PI * 2;
      p.height = (Math.random() - 0.5) * 1.5;
    }
    pos[i*3]     = player.x + Math.cos(p.angle) * p.radius * player.size;
    pos[i*3 + 1] = p.height * player.size + player.size * 0.3;
    pos[i*3 + 2] = player.z + Math.sin(p.angle) * p.radius * player.size;
  }
  particleGeo.attributes.position.needsUpdate = true;
}

// ============ Player Update ============
function updatePlayer(dt) {
  // Keyboard
  let kx = 0, ky = 0;
  if (game.keys['KeyW'] || game.keys['ArrowUp']) ky -= 1;
  if (game.keys['KeyS'] || game.keys['ArrowDown']) ky += 1;
  if (game.keys['KeyA'] || game.keys['ArrowLeft']) kx -= 1;
  if (game.keys['KeyD'] || game.keys['ArrowRight']) kx += 1;

  let mx = kx + game.moveX;
  let my = ky + game.moveY;
  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }

  // Velocity
  const targetVX = mx * player.speed;
  const targetVZ = my * player.speed;
  player.vx += (targetVX - player.vx) * Math.min(1, dt * 8);
  player.vz += (targetVZ - player.vz) * Math.min(1, dt * 8);

  player.x += player.vx * dt;
  player.z += player.vz * dt;

  // Clamp to world
  const bound = WORLD.size * 0.95;
  if (player.x < -bound) { player.x = -bound; player.vx = 0; }
  if (player.x > bound) { player.x = bound; player.vx = 0; }
  if (player.z < -bound) { player.z = -bound; player.vz = 0; }
  if (player.z > bound) { player.z = bound; player.vz = 0; }

  // Update black hole
  blackHoleGroup.position.set(player.x, player.size * 0.3, player.z);
  blackHoleGroup.scale.setScalar(player.size);

  // Rotate rings
  ring1.rotation.z += dt * 2;
  ring2.rotation.y += dt * 1.5;
  ring1.rotation.x = Math.PI / 2 + Math.sin(performance.now() * 0.001) * 0.1;

  // Purple light follows player
  purpleLight.position.set(player.x, player.size * 2, player.z);
  purpleLight.intensity = 1.2 + Math.sin(performance.now() * 0.003) * 0.3;

  // Camera
  updateCamera(dt);

  // Grow camera fog based on size
  const fogEnd = 90 + player.size * 5;
  scene.fog.near = 45 + player.size * 3;
  scene.fog.far = fogEnd;
}

// ============ Objects Update ============
const eaten = [];

function updateObjects(dt) {
  const particleEmit = [];
  for (let i = 0; i < objects.length; i++) {
    const obj = objects[i];
    if (obj.eaten) continue;

    const dx = player.x - obj.x;
    const dz = player.z - obj.z;
    const dist = Math.hypot(dx, dz);

    // Suction field
    const suctionRadius = player.size * 6 + 3;
    if (dist < suctionRadius) {
      const pull = (1 - dist / suctionRadius) * 30 * player.size;
      const nx = dx / (dist || 1);
      const nz = dz / (dist || 1);
      obj.x += nx * pull * dt;
      obj.z += nz * pull * dt;

      // Spin effect
      obj.spin += dt * 3 * (1 - dist / suctionRadius);
    }

    // Check if eaten
    const eatRadius = player.size + obj.size * 0.4;
    if (dist < eatRadius && obj.size < player.size * 1.4) {
      eatObject(obj);
      continue;
    }

    // Update mesh position
    obj.mesh.position.x = obj.x;
    obj.mesh.position.z = obj.z;
    if (obj.spinning || obj.spin > 0.01) {
      obj.mesh.rotation.y += obj.spin * dt;
      obj.spin *= 0.96;
    }
  }
}

function eatObject(obj) {
  obj.eaten = true;

  // Score
  game.score += obj.points;
  updateHUDScore();

  // Mass growth
  player.mass += obj.mass;
  const newSize = 0.5 + Math.pow(player.mass, 0.32) * 0.55;
  const oldSize = player.size;
  player.size = Math.min(player.maxSize, newSize);
  if (player.size > game.maxSizeReached) game.maxSizeReached = player.size;

  // Size upgrade banner
  const oldTier = getSizeTier(oldSize);
  const newTier = getSizeTier(player.size);
  if (newTier > oldTier) {
    showGrowBanner(newTier);
    sfx.grow();
    if (tg?.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
  } else {
    sfx.eatSmall();
  }

  // Screen shake based on size
  game.shake = Math.min(12, 3 + obj.size * 1.5);

  // Particle burst
  for (let k = 0; k < 6 + Math.floor(obj.size * 3); k++) {
    particleEmit.push({ x: obj.x, z: obj.z });
  }

  // Eat popup
  showEatPopup(obj.points, obj.x, obj.z);

  // Remove from scene
  scene.remove(obj.mesh);

  // Respawn as new object
  const newObj = createRandomObject();
  objects[i] = newObj;
}

// Global variable for eaten respawn
let i = 0; // temp

function getSizeTier(size) {
  if (size < 1.0) return 1;
  if (size < 1.6) return 2;
  if (size < 2.4) return 3;
  if (size < 3.5) return 4;
  if (size < 5.0) return 5;
  return 6;
}

// ============ UI Effects ============
function showGrowBanner(tier) {
  const banner = document.getElementById('growBanner');
  const labels = ['', '', 'كبرت!', 'أقوى!', 'وحش!', 'أسطورة!', 'إله!'];
  banner.textContent = labels[tier] || 'كبرت!';
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');
}

function showEatPopup(points, worldX, worldZ) {
  // Convert world to screen
  const vec = new THREE.Vector3(worldX, 1, worldZ);
  vec.project(camera);
  const screenX = (vec.x * 0.5 + 0.5) * window.innerWidth;
  const screenY = (-vec.y * 0.5 + 0.5) * window.innerHeight;

  const el = document.createElement('div');
  el.className = 'eatPopup';
  el.textContent = '+' + points;
  el.style.left = screenX + 'px';
  el.style.top = screenY + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function updateHUDScore() {
  document.getElementById('scoreVal').textContent = game.score;
}

function updateSizeHUD() {
  document.getElementById('sizeVal').textContent = player.size.toFixed(1);
}

function updateTimeHUD() {
  const t = Math.ceil(game.timeLeft);
  document.getElementById('timeVal').textContent = t;
  const pct = (game.timeLeft / 90) * 100;
  document.getElementById('timeFill').style.width = pct + '%';
  const bar = document.getElementById('timeBar');
  if (game.timeLeft < 20) {
    bar.classList.add('warn');
    document.getElementById('lowTimeFlash').classList.add('show');
  } else {
    bar.classList.remove('warn');
    document.getElementById('lowTimeFlash').classList.remove('show');
  }
}

// ============ Joystick Visual ============
let joyCanvasEl = null;
function drawJoystick() {
  if (!game.joyActive) return;
  if (!joyCanvasEl) {
    joyCanvasEl = document.createElement('canvas');
    joyCanvasEl.id = 'joyCanvas';
    joyCanvasEl.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9;';
    document.body.appendChild(joyCanvasEl);
  }
  if (joyCanvasEl.width !== window.innerWidth) {
    joyCanvasEl.width = window.innerWidth;
    joyCanvasEl.height = window.innerHeight;
  }
  const ctx = joyCanvasEl.getContext('2d');
  ctx.clearRect(0, 0, joyCanvasEl.width, joyCanvasEl.height);

  const cx = game.joyCenterX;
  const cy = game.joyCenterY;
  const maxR = game.joyMax;

  // Ring
  ctx.strokeStyle = 'rgba(168,85,247,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
  ctx.stroke();

  // Inner glow
  const grd = ctx.createRadialGradient(cx, cy, 5, cx, cy, maxR);
  grd.addColorStop(0, 'rgba(168,85,247,0.15)');
  grd.addColorStop(1, 'rgba(168,85,247,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
  ctx.fill();

  // Knob
  ctx.fillStyle = 'rgba(192,132,252,0.85)';
  ctx.beginPath();
  ctx.arc(game.joyCurX, game.joyCurY, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 3;
  ctx.stroke();
}

// ============ Game Loop ============
let lastTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  if (!lastTime) { lastTime = now; return; }
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (game.mode === 'playing') {
    // Timer
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      endGame();
    }

    // Tick sound for last 10 seconds
    if (game.timeLeft < 10.5 && game.timeLeft > 0) {
      game.tickTimer -= dt;
      if (game.tickTimer <= 0) {
        sfx.tick();
        game.tickTimer = 1;
      }
    }

    updatePlayer(dt);
    updateObjects(dt);
    updateParticles(dt);

    // Shake
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 30);

    // Apply shake to camera
    if (game.shake > 0) {
      camera.position.x += (Math.random() - 0.5) * game.shake * 0.15;
      camera.position.z += (Math.random() - 0.5) * game.shake * 0.15;
    }

    updateTimeHUD();
    updateSizeHUD();
    drawJoystick();
  } else {
    // Menu — slow orbit camera
    const t = now * 0.0003;
    camera.position.x = Math.cos(t) * 30;
    camera.position.z = Math.sin(t) * 30 + 20;
    camera.position.y = 22;
    camera.lookAt(0, 2, 0);
    updateParticles(dt);
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// ============ Start / End ============
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (IS_TOUCH && screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }

  // Reset player
  player.x = 0; player.z = 0;
  player.vx = 0; player.vz = 0;
  player.size = 0.7;
  player.mass = 8;
  game.maxSizeReached = 0.7;

  // Reset game
  game.score = 0;
  game.timeLeft = 90;
  game.tickTimer = 0;
  game.shake = 0;
  game.moveX = 0;
  game.moveY = 0;

  // Reset objects
  for (let k = 0; k < objects.length; k++) {
    scene.remove(objects[k].mesh);
    objects[k] = createRandomObject();
  }

  // Camera reset
  camera.position.set(0, 24, 20);

  document.getElementById('hud').classList.add('show');
  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('overScreen').classList.remove('show');
  document.getElementById('lowTimeFlash').classList.remove('show');

  updateHUDScore();
  updateSizeHUD();
  updateTimeHUD();

  game.mode = 'playing';
}

function endGame() {
  game.mode = 'over';
  sfx.end();
  if (tg?.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('error'); } catch(e){} }

  const isNewRecord = game.score > game.best;
  if (isNewRecord) {
    game.best = game.score;
    try { localStorage.setItem('blackhole_best', String(game.best)); } catch(e){}
  }

  document.getElementById('finalScore').textContent = game.score;
  document.getElementById('finalSize').textContent = game.maxSizeReached.toFixed(1);
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('overScreen').classList.add('show');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('lowTimeFlash').classList.remove('show');

  if (joyCanvasEl) {
    const ctx = joyCanvasEl.getContext('2d');
    ctx.clearRect(0, 0, joyCanvasEl.width, joyCanvasEl.height);
  }
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ============ Resize ============
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  updateRotateMsg();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(updateRotateMsg, 200));

function updateRotateMsg() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const msg = document.getElementById('rotateMsg');
  if (IS_TOUCH && isPortrait && game.mode === 'menu') msg.classList.add('show');
  else msg.classList.remove('show');
}
updateRotateMsg();

// ============ Init ============
camera.position.set(0, 24, 20);
camera.lookAt(0, 2, 0);
updateSizeHUD();

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ATLAS — الهروب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#e8eef5;
    font-family:'Cairo', Tahoma, sans-serif;
    touch-action:none; cursor:none;
  }
  #game { position:absolute; inset:0; display:block; width:100%; height:100%; }
  #game.active { cursor:none; }

  /* ================= HUD ================= */
  #hud {
    position:absolute; inset:0;
    pointer-events:none; z-index:10;
    display:none;
  }
  #hud.show { display:block; }

  /* Crosshair */
  #crosshair {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:24px; height:24px;
    pointer-events:none;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(255,50,50,0.9);
    box-shadow:0 0 6px rgba(255,50,50,0.8);
  }
  #crosshair::before {
    top:50%; left:0; width:100%; height:2px;
    transform:translateY(-50%);
  }
  #crosshair::after {
    left:50%; top:0; width:2px; height:100%;
    transform:translateX(-50%);
  }
  #crosshair .dot {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:3px; height:3px; border-radius:50%;
    background:#fff; box-shadow:0 0 4px #ff0000;
  }

  /* Health bar (bottom left) */
  #healthBox {
    position:absolute; bottom:20px; left:20px;
    width:220px; max-width:40vw;
  }
  #healthBox .lbl {
    font-size:11px; font-weight:900; letter-spacing:2px;
    color:#8a1414; margin-bottom:5px;
    text-shadow:0 0 8px rgba(255,0,0,0.5);
  }
  #healthBar {
    height:14px; background:rgba(0,0,0,0.7);
    border:1px solid rgba(139,20,20,0.6);
    border-radius:4px; overflow:hidden;
    box-shadow:inset 0 0 10px rgba(0,0,0,0.8);
  }
  #healthFill {
    height:100%; width:100%;
    background:linear-gradient(90deg, #8a1414 0%, #d42020 100%);
    transition:width 0.2s;
    box-shadow:0 0 12px rgba(212,32,32,0.7);
  }

  /* Ammo (bottom right) */
  #ammoBox {
    position:absolute; bottom:20px; right:20px;
    text-align:left; direction:ltr;
  }
  #ammoBox .num {
    font-family:'Orbitron', sans-serif;
    font-size:42px; font-weight:900; color:#f5c518;
    line-height:1; text-shadow:0 0 16px rgba(245,197,24,0.7);
  }
  #ammoBox .num small {
    font-size:20px; color:#8a8a8a; margin-left:4px;
  }
  #ammoBox .lbl {
    font-size:10px; font-weight:900; letter-spacing:3px;
    color:#8a8a8a; margin-top:3px; text-align:right;
  }

  /* Score & Wave (top center) */
  #topInfo {
    position:absolute; top:16px; left:50%;
    transform:translateX(-50%);
    text-align:center;
  }
  #topInfo .wave {
    font-family:'Orbitron', sans-serif;
    font-size:14px; font-weight:900; letter-spacing:4px;
    color:#d42020; text-shadow:0 0 12px rgba(212,32,32,0.8);
    margin-bottom:6px;
  }
  #topInfo .score {
    font-family:'Orbitron', sans-serif;
    font-size:24px; font-weight:900; color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,0.5);
  }

  /* Damage vignette */
  #damageOverlay {
    position:absolute; inset:0;
    background:radial-gradient(circle at center, transparent 30%, rgba(180,0,0,0.7) 100%);
    opacity:0; pointer-events:none;
    transition:opacity 0.3s;
    z-index:9;
  }
  #damageOverlay.flash { opacity:1; transition:opacity 0s; }

  /* ================= Touch Controls ================= */
  #touchControls {
    position:absolute; inset:0;
    z-index:20; display:none;
  }
  #touchControls.show { display:block; }

  /* Joystick (left) */
  #joystick {
    position:absolute; bottom:30px; left:30px;
    width:130px; height:130px; border-radius:50%;
    background:rgba(255,255,255,0.05);
    border:2px solid rgba(255,255,255,0.2);
    touch-action:none;
  }
  #joystickBase {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:60px; height:60px; border-radius:50%;
    background:rgba(245,197,24,0.35);
    border:2px solid rgba(245,197,24,0.7);
    box-shadow:0 0 20px rgba(245,197,24,0.4);
    pointer-events:none;
  }

  /* Buttons (right) */
  .touchBtn {
    position:absolute;
    width:80px; height:80px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.25);
    color:#fff; font-family:'Cairo', sans-serif;
    font-size:11px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.1;
    touch-action:none;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .touchBtn:active {
    background:rgba(245,197,24,0.25);
    border-color:rgba(245,197,24,0.7);
    transform:scale(0.95);
  }
  #shootBtn {
    bottom:110px; right:30px;
    width:100px; height:100px;
    background:rgba(200,30,30,0.25);
    border-color:rgba(255,80,80,0.6);
    font-size:13px;
  }
  #jumpBtn { bottom:30px; right:130px; }
  #runBtn  { bottom:130px; right:150px; width:70px; height:70px; font-size:10px; }

  /* ================= Overlays ================= */
  .overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    justify-content:center; align-items:center;
    background:radial-gradient(circle at center, rgba(20,0,0,0.95), rgba(0,0,0,1));
    z-index:30; padding:24px; text-align:center;
  }
  .overlay.show { display:flex; }

  .title-horror {
    font-family:'Orbitron', sans-serif;
    font-size:64px; font-weight:900; letter-spacing:12px;
    color:#d42020; line-height:1; margin-bottom:6px;
    text-shadow:
      0 0 10px rgba(255,0,0,0.9),
      0 0 25px rgba(255,0,0,0.5),
      0 0 45px rgba(255,0,0,0.3);
    animation:horrorPulse 2.5s ease-in-out infinite;
  }
  @keyframes horrorPulse {
    0%,100% { text-shadow:0 0 10px rgba(255,0,0,0.9), 0 0 25px rgba(255,0,0,0.5); opacity:1; }
    50%     { text-shadow:0 0 20px rgba(255,0,0,1), 0 0 45px rgba(255,0,0,0.7); opacity:0.92; }
  }
  .subtitle-horror {
    font-size:14px; color:#8a1414; letter-spacing:14px;
    margin-bottom:40px; font-weight:900;
    text-shadow:0 0 10px rgba(255,0,0,0.4);
  }
  .desc {
    max-width:340px; color:#a0a8b0; font-size:14px;
    line-height:2; margin-bottom:32px;
  }
  .desc b { color:#d42020; }

  .btn {
    font-family:'Cairo', sans-serif;
    padding:16px 52px; font-size:18px; font-weight:900;
    background:linear-gradient(180deg, #d42020, #8a1414);
    color:#fff; border:none; border-radius:8px;
    cursor:pointer; letter-spacing:2px;
    box-shadow:0 6px 0 #400808, 0 8px 24px rgba(212,32,32,0.5);
    transition:transform 0.1s, box-shadow 0.1s;
    margin:6px 0;
  }
  .btn:active {
    transform:translateY(5px);
    box-shadow:0 1px 0 #400808;
  }

  /* Loading */
  #loading {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    background:#000; z-index:100;
  }
  #loading .spinner {
    width:60px; height:60px;
    border:3px solid rgba(212,32,32,0.2);
    border-top-color:#d42020;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:20px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading .txt {
    color:#d42020; letter-spacing:6px;
    font-size:13px; font-weight:900;
  }

  /* Game over */
  .gameOverTitle {
    font-family:'Orbitron', sans-serif;
    font-size:52px; font-weight:900; letter-spacing:8px;
    color:#d42020; line-height:1; margin-bottom:8px;
    text-shadow:0 0 20px rgba(255,0,0,0.9);
  }
  .stats-block {
    display:flex; gap:36px; margin:24px 0 32px;
  }
  .stat-item { text-align:center; }
  .stat-item .lbl {
    font-size:10px; color:#8a8a8a; letter-spacing:2px;
    font-weight:900; margin-bottom:6px;
  }
  .stat-item .val {
    font-family:'Orbitron', sans-serif;
    font-size:36px; font-weight:900; color:#f5c518;
    line-height:1; text-shadow:0 0 16px rgba(245,197,24,0.6);
  }
  .stat-item .val.red { color:#d42020; text-shadow:0 0 16px rgba(212,32,32,0.7); }

  /* Hint at start */
  #hint {
    position:absolute; bottom:50%; left:50%;
    transform:translate(-50%, 50%);
    color:#a0a8b0; font-size:14px;
    text-align:center; pointer-events:none;
    z-index:11; display:none;
    text-shadow:0 0 10px rgba(0,0,0,0.9);
  }
  #hint.show { display:block; animation:pulseHint 2s ease-in-out infinite; }
  @keyframes pulseHint {
    0%,100% { opacity:0.6; }
    50% { opacity:1; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div class="txt">جاري التحميل...</div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>
  <div id="topInfo">
    <div class="wave" id="waveLabel">الموجة 1</div>
    <div class="score" id="scoreLabel">0</div>
  </div>
  <div id="healthBox">
    <div class="lbl">الصحة</div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div id="ammoBox">
    <div class="num" id="ammoNum">30<small>/∞</small></div>
    <div class="lbl">الرصاص</div>
  </div>
  <div id="damageOverlay"></div>
</div>

<div id="hint">اضغط على الشاشة للتحكم</div>

<!-- Touch Controls -->
<div id="touchControls">
  <div id="joystick">
    <div id="joystickBase"></div>
  </div>
  <div class="touchBtn" id="shootBtn">إطلاق</div>
  <div class="touchBtn" id="jumpBtn">قفز</div>
  <div class="touchBtn" id="runBtn">جري</div>
</div>

<!-- Start Screen -->
<div class="overlay show" id="startScreen">
  <div class="title-horror">ATLAS</div>
  <div class="subtitle-horror">الـــهـــروب</div>
  <div class="desc">
    أنت محبوس في مكان مظلم.<br>
    <b>الأشباح قادمة...</b><br>
    اقتل أكبر عدد ممكن قبل أن يمسكوك.
  </div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<!-- Game Over Screen -->
<div class="overlay" id="overScreen">
  <div class="gameOverTitle">انتهت اللعبة</div>
  <div class="stats-block">
    <div class="stat-item"><div class="lbl">أشباح</div><div class="val red" id="finalKills">0</div></div>
    <div class="stat-item"><div class="lbl">الموجات</div><div class="val" id="finalWave">1</div></div>
    <div class="stat-item"><div class="lbl">الوقت</div><div class="val" id="finalTime">0s</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<!-- Three.js library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================================================================
// ATLAS — الهروب | الجزء 2: المشهد والبيئة والإضاءة
// ==================================================================

// ==================== إعدادات عامة ====================
const GAME = {
  W: window.innerWidth,
  H: window.innerHeight,
  isMobile: /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent),
  isTouch: 'ontouchstart' in window,
  // حدود الأداء — تعدل حسب الجهاز
  maxParticles: 40,
  maxShadows: 0,     // نطفي الظلال عشان نسرع
  fogNear: 3,
  fogFar: 28,
  flashlightIntensity: 1.8,
  ambientIntensity: 0.08,
};

// ==================== Scene / Camera / Renderer ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, GAME.fogNear, GAME.fogFar);

const camera = new THREE.PerspectiveCamera(
  75,
  GAME.W / GAME.H,
  0.1,
  100
);
camera.position.set(0, 1.6, 0);

// Renderer — إعدادات الأداء القصوى
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('game'),
  antialias: false,        // ⚡ أسرع بمرتين
  powerPreference: 'high-performance',
  alpha: false,
  stencil: false,
  depth: true,
  logarithmicDepthBuffer: false,
});
let pixelRatio = Math.min(window.devicePixelRatio || 1, GAME.isMobile ? 1.0 : 1.25);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(GAME.W, GAME.H);
renderer.setClearColor(0x000000, 1);
renderer.shadowMap.enabled = false;
renderer.sortObjects = false;   // ⚡ تسريع

// ==================== Lighting ====================
// Ambient — خفيف جداً عشان نظل بالجو المرعب
const ambient = new THREE.AmbientLight(0x1a1a2a, GAME.ambientIntensity);
scene.add(ambient);

// Hemisphere للإحساس بالتدرج
const hemi = new THREE.HemisphereLight(0x1a1030, 0x000000, 0.15);
scene.add(hemi);

// Flashlight — كشاف على اللاعب
const flashlight = new THREE.SpotLight(0xfff0d0, GAME.flashlightIntensity, 25, Math.PI / 5.5, 0.45, 1.5);
flashlight.position.set(0, 0, 0);
flashlight.castShadow = false;
scene.add(flashlight);
scene.add(flashlight.target);

// ضوء أحمر خافت أحياناً (جو رعب)
const redLight = new THREE.PointLight(0xd42020, 0.15, 15);
redLight.position.set(0, 3, -8);
scene.add(redLight);

// ==================== Materials (مشتركة لتوفير الذاكرة) ====================
const matWall = new THREE.MeshLambertMaterial({ color: 0x2a2420 });
const matWallDark = new THREE.MeshLambertMaterial({ color: 0x1a1510 });
const matFloor = new THREE.MeshLambertMaterial({ color: 0x151210 });
const matCeiling = new THREE.MeshLambertMaterial({ color: 0x0a0808 });
const matPillar = new THREE.MeshLambertMaterial({ color: 0x302820 });
const matMetal = new THREE.MeshLambertMaterial({ color: 0x404040 });
const matBone = new THREE.MeshLambertMaterial({ color: 0xb0a890 });
const matBlood = new THREE.MeshLambertMaterial({ color: 0x5a0808 });

// ==================== أرضية وسقف ====================
const ARENA = {
  w: 60,   // العرض
  d: 60,   // الطول
  h: 6,    // الارتفاع
};

// الأرضية
const floorGeo = new THREE.PlaneGeometry(ARENA.w, ARENA.d, 1, 1);
const floor = new THREE.Mesh(floorGeo, matFloor);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// السقف
const ceilGeo = new THREE.PlaneGeometry(ARENA.w, ARENA.d, 1, 1);
const ceiling = new THREE.Mesh(ceilGeo, matCeiling);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ARENA.h;
scene.add(ceiling);

// ==================== الجدران الأربعة ====================
const wallGeo = new THREE.BoxGeometry(1, 1, 1);

function makeWall(x, y, z, w, h, d, mat) {
  const wall = new THREE.Mesh(wallGeo, mat);
  wall.position.set(x, y, z);
  wall.scale.set(w, h, d);
  scene.add(wall);
  return wall;
}

// جدران خارجية
const halfW = ARENA.w / 2;
const halfD = ARENA.d / 2;
const wallT = 0.6;   // سمك الجدار
const wallH = ARENA.h;

makeWall(-halfW, wallH / 2, 0, wallT, wallH, ARENA.d, matWall);      // غرب
makeWall(halfW, wallH / 2, 0, wallT, wallH, ARENA.d, matWall);       // شرق
makeWall(0, wallH / 2, -halfD, ARENA.w, wallH, wallT, matWall);      // شمال
makeWall(0, wallH / 2, halfD, ARENA.w, wallH, wallT, matWall);       // جنوب

// ==================== متاهة داخلية (جدران ثابتة) ====================
// layout: مصفوفة من الجدران الداخلية
// استخدام كائنات مبسطة للتصادم
const mazeWalls = [];

function addInnerWall(x, z, w, d) {
  const wall = new THREE.Mesh(wallGeo, matWallDark);
  wall.position.set(x, wallH / 2, z);
  wall.scale.set(w, wallH, d);
  scene.add(wall);
  // حفظ للتصادم
  mazeWalls.push({
    minX: x - w / 2, maxX: x + w / 2,
    minZ: z - d / 2, maxZ: z + d / 2,
  });
}

// تخطيط المتاهة — مبسط لكن فيه أماكن للاختباء
const M = 12;  // المسافة بين الجدران

// صف 1
addInnerWall(-12, -12, 8, 0.5);
addInnerWall(12, -12, 8, 0.5);
addInnerWall(-18, -18, 0.5, 8);
addInnerWall(18, -18, 0.5, 8);

// صف 2
addInnerWall(-18, 0, 0.5, 8);
addInnerWall(18, 0, 0.5, 8);
addInnerWall(-8, 6, 8, 0.5);
addInnerWall(8, 6, 8, 0.5);

// صف 3
addInnerWall(-18, 18, 0.5, 8);
addInnerWall(18, 18, 0.5, 8);
addInnerWall(-12, 12, 8, 0.5);
addInnerWall(12, 12, 8, 0.5);

// ممرات وسطية
addInnerWall(0, -8, 0.5, 6);
addInnerWall(0, 8, 0.5, 6);
addInnerWall(-8, -18, 8, 0.5);
addInnerWall(8, -18, 8, 0.5);

// ==================== أعمدة وكائنات ديكور ====================
function addPillar(x, z, h = ARENA.h) {
  const pillar = new THREE.Mesh(wallGeo, matPillar);
  pillar.position.set(x, h / 2, z);
  pillar.scale.set(0.8, h, 0.8);
  scene.add(pillar);
  mazeWalls.push({
    minX: x - 0.4, maxX: x + 0.4,
    minZ: z - 0.4, maxZ: z + 0.4,
  });
}

// أعمدة بالزوايا
addPillar(-6, -6);
addPillar(6, -6);
addPillar(-6, 6);
addPillar(6, 6);
addPillar(-15, -15);
addPillar(15, -15);
addPillar(-15, 15);
addPillar(15, 15);

// ==================== جماجم وعظام (ديكور مرعب) ====================
const skullGeo = new THREE.SphereGeometry(0.2, 6, 5);
const boneGeo = new THREE.BoxGeometry(0.08, 0.08, 0.4);

function addSkull(x, z) {
  const skull = new THREE.Mesh(skullGeo, matBone);
  skull.position.set(x, 0.2, z);
  skull.scale.set(1, 0.85, 1.1);
  scene.add(skull);
  // فك
  const jaw = new THREE.Mesh(boneGeo, matBone);
  jaw.position.set(x, 0.08, z + 0.12);
  jaw.scale.set(0.9, 0.6, 0.5);
  scene.add(jaw);
}

function addBones(x, z) {
  for (let i = 0; i < 3; i++) {
    const bone = new THREE.Mesh(boneGeo, matBone);
    bone.position.set(
      x + (Math.random() - 0.5) * 1.5,
      0.06,
      z + (Math.random() - 0.5) * 1.5
    );
    bone.rotation.y = Math.random() * Math.PI;
    scene.add(bone);
  }
}

// بقع دم على الأرض
function addBlood(x, z) {
  const bloodGeo = new THREE.CircleGeometry(0.6 + Math.random() * 0.5, 8);
  const blood = new THREE.Mesh(bloodGeo, matBlood);
  blood.rotation.x = -Math.PI / 2;
  blood.position.set(x, 0.01, z);
  blood.rotation.z = Math.random() * Math.PI;
  scene.add(blood);
}

// نوزع الديكور بشكل عشوائي
const decorPoints = [
  [-16, -8], [-14, 3], [-16, 10], [-10, -14], [-4, -16],
  [10, -14], [14, -4], [16, 8], [12, 16], [4, 16],
  [-8, 14], [-14, 14], [14, -14], [8, -8], [-8, 8],
];

decorPoints.forEach((p, i) => {
  if (i % 3 === 0) addSkull(p[0], p[1]);
  else if (i % 3 === 1) addBones(p[0], p[1]);
  else addBlood(p[0], p[1]);
});

// ==================== خلفيات الجدران (شخابيط) ====================
// نرسم خطوط فسفورية خافتة كأنها شخابيط على جدران معينة
const scratchesMat = new THREE.LineBasicMaterial({ color: 0x5a0a0a });
const scratchesPoints = [];

function addScratches(x, y, z, len, vertical) {
  const points = [];
  if (vertical) {
    for (let i = 0; i < 4; i++) {
      points.push(new THREE.Vector3(x + i * 0.15 - 0.3, y - len / 2, z));
      points.push(new THREE.Vector3(x + i * 0.15 - 0.2, y + len / 2, z));
    }
  } else {
    for (let i = 0; i < 4; i++) {
      points.push(new THREE.Vector3(x, y - len / 2 + i * 0.15, z));

  if (audioCtx) return;

function playTone(freq, type, dur, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}

    if (dist > 1.2) {
      g.wobble += dt * 3;
      const wob = Math.sin(g.wobble) * 0.3;
      const ax = dx / dist;
      const az = dz / dist;
      // انحراف بسيط عشان ما تكون حركة مستقيمة تماماً
      const rx = ax - az * wob;
      const rz = az + ax * wob;
      g.pos.x += rx * g.speed * dt;
      g.pos.z += rz * g.speed * dt;

      // منع الدخول في الجدران — نبسّطها: لا نخترق الجدران الكبيرة
      // (نكتفي بحدود الغرفة)
      if (g.pos.x < -halfW + 1) g.pos.x = -halfW + 1;
      if (g.pos.x > halfW - 1) g.pos.x = halfW - 1;
      if (g.pos.z < -halfD + 1) g.pos.z = -halfD + 1;
      if (g.pos.z > halfD - 1) g.pos.z = halfD - 1;
    }

    // ارتفاع الجسم (تحوم)
    g.mesh.position.x = g.pos.x;
    g.mesh.position.z = g.pos.z;
    g.mesh.position.y = 0.15 + Math.sin(g.life * 3) * 0.15;
    g.mesh.rotation.y = Math.atan2(dx, dz);

    // هجوم
    g.attackCooldown -= dt;
    if (dist < 1.5 && g.attackCooldown <= 0) {
      damagePlayer(8);
      g.attackCooldown = 1.2;
      // تأثير بصري
      if (audioCtx) playTone(150, 'sawtooth', 0.2, 0.08, 60);
    }

    // أنين عشوائي
    if (Math.random() < dt * 0.15) {
      sfxGhostGroan();
    }
  }
}

// ==================== Wave System ====================
const WAVE_CONFIG = {
  baseCount: 3,
  addPerWave: 2,
  maxCount: MAX_GHOSTS,
  baseSpeed: 1.2,
  speedPerWave: 0.15,
  maxSpeed: 3.5,
  baseHp: 3,
  hpPerWave: 1,
};

let waveGhostsSpawned = 0;
let waveGhostsTotal = 0;
let waveSpawnTimer = 0;
let waveDelayTimer = 0;
let waveInProgress = false;

function startWave(waveNum) {
  gameState.wave = waveNum;
  updateWaveDisplay();
  sfxWaveStart();
  
  // حساب عدد الأشباح
  waveGhostsTotal = Math.min(
    WAVE_CONFIG.maxCount,
    WAVE_CONFIG.baseCount + (waveNum - 1) * WAVE_CONFIG.addPerWave
  );
  waveGhostsSpawned = 0;
  waveInProgress = true;
  waveSpawnTimer = 1.5;   // ننتظر شوية قبل ما نبدأ
}

function spawnWaveGhost() {
  const waveNum = gameState.wave;
  const speed = Math.min(
    WAVE_CONFIG.maxSpeed,
    WAVE_CONFIG.baseSpeed + (waveNum - 1) * WAVE_CONFIG.speedPerWave
  );
  const hp = WAVE_CONFIG.baseHp + (waveNum - 1) * WAVE_CONFIG.hpPerWave;
  const type = Math.floor(Math.random() * 3);

  // موقع بعيد عن اللاعب
  let x, z, tries = 0;
  do {
    // نطلع من حدود الخريطة قريبة من الزاوية
    const side = Math.floor(Math.random() * 4);
    const offset = 15 + Math.random() * 12;
    if (side === 0) { x = player.pos.x + offset; z = player.pos.z + (Math.random() - 0.5) * 30; }
    else if (side === 1) { x = player.pos.x - offset; z = player.pos.z + (Math.random() - 0.5) * 30; }
    else if (side === 2) { x = player.pos.x + (Math.random() - 0.5) * 30; z = player.pos.z + offset; }
    else { x = player.pos.x + (Math.random() - 0.5) * 30; z = player.pos.z - offset; }
    // نقص على حدود الغرفة
    x = Math.max(-halfW + 2, Math.min(halfW - 2, x));
    z = Math.max(-halfD + 2, Math.min(halfD - 2, z));
    tries++;
  } while (checkCollision(x, z) && tries < 20);

  createGhost(new THREE.Vector3(x, 0, z), speed, hp, type);
}

function updateWaves(dt) {
  if (!waveInProgress) return;

  if (waveGhostsSpawned < waveGhostsTotal) {
    waveSpawnTimer -= dt;
    if (waveSpawnTimer <= 0) {
      spawnWaveGhost();
      waveGhostsSpawned++;
      waveSpawnTimer = Math.max(0.4, 1.2 - gameState.wave * 0.05);
    }
  } else {
    // كل الأشباح طلعت — ننتظر حتى يموتون كلهم
    const aliveGhosts = ghosts.filter(g => !g.dying).length;
    if (aliveGhosts === 0) {
      waveInProgress = false;
      waveDelayTimer = 3;
    }
  }

  // بين الموجات
  if (!waveInProgress && waveDelayTimer > 0) {
    waveDelayTimer -= dt;
    if (waveDelayTimer <= 0) {
      startWave(gameState.wave + 1);
    }
  }
}

function resetEnemies() {
  ghosts.forEach(g => scene.remove(g.mesh));
  ghosts.length = 0;
  waveGhostsSpawned = 0;
  waveGhostsTotal = 0;
  waveInProgress = false;
  waveDelayTimer = 0;
  waveSpawnTimer = 0;
}

// ==================== Bullet System ====================
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.06, 4, 3);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });

function shootBullet() {
  if (ammo <= 0) {
    sfxNoAmmo();
    return;
  }
  ammo--;
  updateAmmoBar();
  sfxShoot();

  // اتجاه الإطلاق = اتجاه الكاميرا
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  // نقطة البداية: أمام الكاميرا بقليل
  const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.4));

  // ===== Raycast: نفحص إذا الشبح في الخط =====
  const ray = new THREE.Raycaster(origin, dir, 0, 50);
  const ghostMeshes = [];
  ghosts.forEach(g => {
    if (!g.dying) ghostMeshes.push(g.mesh);
  });

  if (ghostMeshes.length > 0) {
    const hits = ray.intersectObjects(ghostMeshes, true);
    if (hits.length > 0) {
      const hit = hits[0];
      // نطلع الشبح من الشجرة
      let obj = hit.object;
      while (obj.parent && !ghosts.some(g => g.mesh === obj)) {
        obj = obj.parent;
      }
      const ghost = ghosts.find(g => g.mesh === obj);
      if (ghost && !ghost.dying) {
        ghost.hp -= 1;
        // تأثير بصري
        const hp = hit.point;
        spawnParticles(hp.x, hp.y, hp.z, 0xff2020, 8, 2);
        sfxHitGhost();
        if (ghost.hp <= 0) killGhost(ghost);
        // اهتزاز بسيط
        const dx = (Math.random() - 0.5) * 0.05;
        camera.rotation.z += dx;
      }
      // نضيف رصاصة للعرض
      bullets.push({
        mesh: makeBulletMesh(origin, dir),
        pos: origin.clone(),
        vel: dir.clone().multiplyScalar(60),
        life: 0.5,
      });
      return;
    }
  }

  // لا شبح — رصاصة عادية تروح للأمام
  bullets.push({
    mesh: makeBulletMesh(origin, dir),
    pos: origin.clone(),
    vel: dir.clone().multiplyScalar(60),
    life: 0.5,
  });
}

function makeBulletMesh(origin, dir) {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(origin);
  scene.add(b);
  return b;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.pos.add(b.vel.clone().multiplyScalar(dt));
    b.mesh.position.copy(b.pos);
    b.life -= dt;
    if (b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }
}

function resetBullets() {
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
}

// ==================== Particles ====================
const particles = [];
const particleGeo = new THREE.PlaneGeometry(0.12, 0.12);

function spawnParticles(x, y, z, color, count, speed) {
  if (particles.length > GAME.maxParticles) return;
  const mat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.95,
    side: THREE.DoubleSide,
  });
  for (let i = 0; i < count && particles.length < GAME.maxParticles; i++) {
    const mesh = new THREE.Mesh(particleGeo, mat.clone());
    mesh.position.set(x, y, z);
    scene.add(mesh);
    const angle = Math.random() * Math.PI * 2;
    const elevation = (Math.random() - 0.3) * Math.PI;
    const v = speed * (0.5 + Math.random());
    particles.push({
      mesh: mesh,
      vx: Math.cos(angle) * Math.cos(elevation) * v,
      vy: Math.sin(elevation) * v + 1.5,
      vz: Math.sin(angle) * Math.cos(elevation) * v,
      life: 0.7 + Math.random() * 0.4,
      maxLife: 1.1,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 8 * dt;
    p.vx *= 0.96;
    p.vz *= 0.96;
    p.life -= dt;
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    // نرسم دائماً مواجهة للكاميرا
    p.mesh.lookAt(camera.position);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ==================== Shooting Control ====================
let shootCooldown = 0;
const SHOOT_RATE = 0.14;

function updateShooting(dt) {
  shootCooldown -= dt;
  const shooting = input.shoot || input.touchShoot;
  if (shooting && shootCooldown <= 0) {
    shootBullet();
    shootCooldown = SHOOT_RATE;
  }
}

// ==================== Ammo Reload ====================
let reloadTimer = 0;
function updateReload(dt) {
  // إذا خلص الرصاص → ريلود تلقائي بعد 1.2s
  if (ammo <= 0) {
    reloadTimer += dt;
    if (reloadTimer >= 1.2) {
      ammo = maxAmmo;
      reloadTimer = 0;
      updateAmmoBar();
      if (audioCtx) playTone(600, 'square', 0.1, 0.05, 900);
    }
  } else {
    reloadTimer = 0;
  }
}

// ==================== Main Update Override ====================
// نوسّع حلقة اللعبة عشان تشمل الأنظمة الجديدة
const originalUpdatePlayer = updatePlayer;
updatePlayer = function(dt) {
  originalUpdatePlayer(dt);
  updateShooting(dt);
  updateReload(dt);
};

// ==================== تعديل بدء اللعبة ====================
const originalStartGame = startGame;
startGame = function() {
  // إعادة تعيين
  resetEnemies();
  resetBullets();
  ammo = maxAmmo;
  reloadTimer = 0;
  shootCooldown = 0;
  
  originalStartGame();
  // ابدأ الموجة الأولى بعد شوي
  setTimeout(() => {
    if (gameState.running) startWave(1);
  }, 1500);
};

window.updateBullets = updateBullets;

// ==================== نظام الـ Pause (ESC للكمبيوتر) ====================
let paused = false;
window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && gameState.running) {

// ==================== حلقة اللعبة الرئيسية (المُصححة) ====================
let _lastTime = performance.now();
let _animId = null;

function _gameLoop(now) {
  _animId = requestAnimationFrame(_gameLoop);

  let elapsed = (now - _lastTime) / 1000;
  _lastTime = now;
  if (elapsed > 0.1) elapsed = 0.1;

  if (gameState.running && !paused) {
    // نجمعها بـ sub-steps للسلاسة
    const steps = Math.min(4, Math.max(1, Math.round(elapsed / 0.016)));
    const subDt = elapsed / steps;
    for (let i = 0; i < steps; i++) {
      updatePlayer(subDt);
      updateGhosts(subDt);
      updateWaves(subDt);
      updateBullets(subDt);
      updateParticles(subDt);
    }
  }

  renderer.render(scene, camera);
}

function _startLoop() {
  if (_animId !== null) return;
  _lastTime = performance.now();
  _animId = requestAnimationFrame(_gameLoop);
}

function _stopLoop() {
  if (_animId !== null) {
    cancelAnimationFrame(_animId);
    _animId = null;
  }
}

// ==================== تعديل بدء اللعبة (مُصحح) ====================

startGame = function() {

// ==================== تأثير اهتزاز الشاشة عند الإصابة ====================
const _origDamagePlayer = damagePlayer;
damagePlayer = function(amount) {

  // اهتزاز مؤقت
  const cvs = document.getElementById('game');
  cvs.style.transition = 'transform 0.05s';

// ==================== Ambient Sound (خلفية مرعبة) ====================
let ambientOsc = null;
let ambientGain = null;

function startAmbient() {
  if (!audioCtx || ambientOsc) return;
  try {
    ambientOsc = audioCtx.createOscillator();
    ambientGain = audioCtx.createGain();
    ambientOsc.type = 'sine';
    ambientOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
    ambientGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    ambientOsc.connect(ambientGain);
    ambientGain.connect(audioCtx.destination);
    ambientOsc.start();
  } catch(e) {}
}

function stopAmbient() {
  try {
    if (ambientOsc) {
      ambientOsc.stop();
      ambientOsc.disconnect();
      ambientOsc = null;
    }
  } catch(e) {}
}

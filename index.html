<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a2818">
<title>طوبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0a1a10; color:#fff;
  font-family:'Cairo', Tahoma, sans-serif;
  touch-action:none;
}
#game { position:absolute; inset:0; display:block; width:100%; height:100%; }

/* HUD */
#hud {
  position:absolute; top:0; left:0; right:0;
  padding:14px 18px; pointer-events:none; z-index:5;
  display:flex; justify-content:space-between; align-items:flex-start;
}
#hud .title {
  font-family:'Orbitron','Cairo', sans-serif;
  font-size:26px; font-weight:900; letter-spacing:4px;
  color:#f5c518; line-height:1;
  text-shadow: 0 0 8px rgba(245,197,24,0.7), 0 0 20px rgba(245,197,24,0.35);
  animation: glow 2.4s ease-in-out infinite alternate;
}
@keyframes glow {
  from { text-shadow:0 0 6px rgba(245,197,24,0.6); }
  to   { text-shadow:0 0 14px rgba(245,197,24,0.95), 0 0 24px rgba(245,197,24,0.5); }
}
#hud .title small {
  display:block; font-family:'Cairo', sans-serif;
  font-size:11px; font-weight:900; color:#7abf9a;
  letter-spacing:6px; margin-top:3px;
}
#hud .stats { display:flex; gap:14px; }
.stat {
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(245,197,24,0.35);
  border-radius:10px;
  padding:6px 12px; text-align:center;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.stat .lbl { font-size:9px; color:#c8b26a; font-weight:900; letter-spacing:1.5px; }
.stat .val { font-family:'Orbitron', sans-serif; font-size:20px; font-weight:900; color:#fff; margin-top:1px; line-height:1; }

/* Power bar */
#powerWrap {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  width:220px; max-width:60vw;
  z-index:6; pointer-events:none;
  display:none;
}
#powerWrap.show { display:block; }
#powerWrap .lbl {
  font-size:10px; color:#f5c518; font-weight:900;
  letter-spacing:2px; margin-bottom:5px; text-align:center;
  text-shadow:0 0 8px rgba(245,197,24,0.6);
}
#powerBar {
  height:14px; border-radius:8px;
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(245,197,24,0.5);
  overflow:hidden;
  box-shadow:inset 0 0 10px rgba(0,0,0,0.8);
}
#powerFill {
  height:100%; width:0%;
  background:linear-gradient(90deg,#22c55e,#f5c518,#ef4444);
  transition:width 0.05s;
  box-shadow:0 0 12px rgba(245,197,24,0.7);
}

/* Streak (bottom right) */
#streakBadge {
  position:absolute; bottom:24px; right:20px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(245,197,24,0.4);
  border-radius:12px; padding:8px 14px;
  text-align:center; z-index:6;
  opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
#streakBadge.show { opacity:1; }
#streakBadge .n {
  font-family:'Orbitron', sans-serif;
  font-size:24px; font-weight:900; color:#f5c518;
  line-height:1;
  text-shadow:0 0 12px rgba(245,197,24,0.8);
}
#streakBadge .l { font-size:9px; color:#c8b26a; font-weight:900; letter-spacing:2px; }

/* Overlays */
.overlay {
  position:absolute; inset:0;
  display:none; flex-direction:column;
  justify-content:center; align-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(5,25,12,0.9), rgba(0,0,0,0.98));
  z-index:10; padding:24px; text-align:center;
}
.overlay.show { display:flex; }

.big-title {
  font-family:'Orbitron', sans-serif;
  font-size:72px; font-weight:900; letter-spacing:10px;
  color:#f5c518; line-height:1; margin-bottom:4px;
  text-shadow: 0 0 15px rgba(245,197,24,0.85), 0 0 35px rgba(245,197,24,0.4);
  animation: glow 2.4s ease-in-out infinite alternate;
}
.sub-title {
  font-family:'Cairo', sans-serif;
  font-size:14px; font-weight:900; color:#7abf9a;
  letter-spacing:14px; margin-bottom:34px;
}
.desc {
  max-width:340px; color:#c0d8c8; font-size:14px;
  line-height:2; margin-bottom:28px;
}
.desc b { color:#f5c518; }
.desc .key {
  display:inline-block;
  background:rgba(245,197,24,0.15);
  border:1px solid rgba(245,197,24,0.4);
  border-radius:5px; padding:1px 8px; margin:0 2px;
  color:#f5c518; font-weight:900;
}

.btn {
  font-family:'Cairo', sans-serif;
  padding:16px 52px; font-size:18px; font-weight:900;
  background:linear-gradient(180deg, #f5c518, #d4a017);
  color:#0a2818; border:none; border-radius:14px;
  cursor:pointer; letter-spacing:1px;
  box-shadow: 0 6px 0 #8b6f0f, 0 8px 24px rgba(245,197,24,0.35);
  transition:transform 0.1s, box-shadow 0.1s;
  margin:6px 0;
}
.btn:active {
  transform:translateY(5px);
  box-shadow: 0 1px 0 #8b6f0f;
}

/* Game over screen */
.go-title {
  font-family:'Orbitron', sans-serif;
  font-size:36px; font-weight:900; letter-spacing:6px;
  color:#ef4444; line-height:1; margin-bottom:6px;
  text-shadow:0 0 18px rgba(239,68,68,0.7);
}
.final-block {
  display:flex; gap:38px; margin:26px 0 30px;
}
.final-block .item { text-align:center; }
.final-block .lbl {
  font-size:11px; color:#7abf9a; font-weight:900;
  letter-spacing:2px; margin-bottom:5px;
}
.final-block .val {
  font-family:'Orbitron', sans-serif;
  font-size:48px; font-weight:900; color:#f5c518;
  line-height:1; text-shadow:0 0 16px rgba(245,197,24,0.6);
}
.final-block .val.small { font-size:32px; color:#4ade80; text-shadow:0 0 14px rgba(74,222,128,0.5); }
.final-block .val.red { font-size:32px; color:#ef4444; text-shadow:0 0 14px rgba(239,68,68,0.6); }

.new-record {
  font-family:'Cairo', sans-serif;
  font-size:14px; font-weight:900; color:#4ade80;
  letter-spacing:2px; margin-bottom:12px;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

/* Rotate msg for portrait mobile */
#rotateMsg {
  position:fixed; inset:0; z-index:9999;
  display:none; flex-direction:column;
  justify-content:center; align-items:center;
  background:#0a1a10; color:#fff; text-align:center; padding:20px;
}
#rotateMsg.show { display:flex; }
#rotateMsg .icon { font-size:80px; margin-bottom:20px; animation:rot 2s ease-in-out infinite; }
@keyframes rot { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(90deg); } }
#rotateMsg .txt { font-size:18px; font-weight:900; color:#f5c518; letter-spacing:2px; }
#rotateMsg .sub { font-size:13px; color:#7abf9a; margin-top:10px; }
@media (orientation: portrait) { #rotateMsg.show { display:flex; } }

/* Goal flash effect */
#goalFlash {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at center, rgba(74,222,128,0.6), transparent 70%);
  opacity:0; z-index:8;
}
#goalFlash.show { animation: goalAnim 0.7s ease-out; }
@keyframes goalAnim {
  0% { opacity:0; }
  20% { opacity:1; }
  100% { opacity:0; }
}
</style>
</head>
<body>

<div id="rotateMsg">
  <div class="icon">⚽</div>
  <div class="txt">أدِر جهازك بالعرض</div>
  <div class="sub">أفضل تجربة بالوضع الأفقي</div>
</div>

<canvas id="game"></canvas>
<div id="goalFlash"></div>

<div id="hud">
  <div class="title">طوبة<small>الـهـدف</small></div>
  <div class="stats">
    <div class="stat"><div class="lbl">الأهداف</div><div class="val" id="scoreVal">0</div></div>
    <div class="stat"><div class="lbl">الموجة</div><div class="val" id="waveVal">1</div></div>
  </div>
</div>

<div id="powerWrap">
  <div class="lbl">القوة</div>
  <div id="powerBar"><div id="powerFill"></div></div>
</div>

<div id="streakBadge">
  <div class="n" id="streakVal">0</div>
  <div class="l">متتالية</div>
</div>

<div class="overlay show" id="startScreen">
  <div class="big-title">طوبة</div>
  <div class="sub-title">الـــهـــدف</div>
  <div class="desc">
    اسحب من الكرة <b>للأمام</b> لتسديد الطوبة<br>
    تجاوز الحارس وسجّل في المرمى ⚽<br>
    كل <b>5 أهداف</b> = موجة أصعب
  </div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<div class="overlay" id="overScreen">
  <div class="go-title">انتهى الوقت</div>
  <div class="new-record" id="newRecord" style="display:none;">🏆 رقم قياسي جديد!</div>
  <div class="final-block">
    <div class="item"><div class="lbl">الأهداف</div><div class="val" id="finalScore">0</div></div>
    <div class="item"><div class="lbl">أعلى متتالية</div><div class="val small" id="finalStreak">0</div></div>
    <div class="item"><div class="lbl">الموجات</div><div class="val red" id="finalWave">1</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<script>
/* ==========================================================
   طوبة — لعبة تسديد ركلات
   Canvas 2D · سلاسة كاملة
   ========================================================== */

const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ============ Telegram ============
const tg = window.Telegram?.WebApp;
if (tg) {
  try { tg.expand(); tg.ready(); tg.setHeaderColor('#0a2818'); tg.setBackgroundColor('#0a1a10'); } catch(e){}
}

// ============ Audio ============
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, type, dur, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bs = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(freq || 1000, t);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}
const sfx = {
  kick: () => {
    noise(0.08, 0.3, 1500);
    tone(200, 'sine', 0.1, 0.15, 80);
  },
  goal: () => {
    tone(660, 'triangle', 0.12, 0.15);
    setTimeout(() => tone(880, 'triangle', 0.12, 0.15), 90);
    setTimeout(() => tone(1320, 'triangle', 0.25, 0.15), 180);
    setTimeout(() => noise(0.5, 0.1, 800), 300);
  },
  miss: () => {
    tone(300, 'sawtooth', 0.2, 0.1, 100);
    noise(0.15, 0.15, 600);
  },
  save: () => {
    noise(0.1, 0.2, 800);
    tone(180, 'square', 0.12, 0.12, 90);
  },
  post: () => {
    tone(1200, 'square', 0.15, 0.15, 800);
    tone(900, 'sine', 0.25, 0.1, 400);
  },
  levelUp: () => {
    tone(660, 'sine', 0.1, 0.12);
    setTimeout(() => tone(880, 'sine', 0.1, 0.12), 80);
    setTimeout(() => tone(1200, 'sine', 0.18, 0.12), 160);
  },
  streak: () => {
    tone(880, 'triangle', 0.08, 0.12);
    setTimeout(() => tone(1200, 'triangle', 0.12, 0.12), 70);
  }
};

// ============ Canvas ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ Game State ============
const game = {
  mode: 'menu',   // menu | playing | over
  score: 0,
  wave: 1,
  streak: 0,
  maxStreak: 0,
  best: 0,
  timeLeft: 60,
  lastTime: 0,
  // Ball state
  ball: {
    x: 0, y: 0, z: 0,     // world position (z is height)
    vx: 0, vy: 0, vz: 0,  // velocity
    radius: 14,
    flying: false,
    spin: 0,
  },
  // Keeper
  keeper: {
    x: 0, y: 0,
    targetX: 0,
    speed: 180,
    width: 70,
    height: 130,
  },
  // Goal line
  goal: {
    x: 0, y: 0,
    width: 0,
    height: 0,
    depth: 0,
  },
  // Drag state
  drag: {
    active: false,
    startX: 0, startY: 0,
    currentX: 0, currentY: 0,
  },
  particles: [],
  floatingTexts: [],
  goalAnim: 0,
  shake: 0,
};

// Persistent best
try {
  const b = parseInt(localStorage.getItem('toba_best') || '0', 10);
  if (!isNaN(b)) game.best = b;
} catch(e){}

// ============ Layout ============
let layout = {};

function computeLayout() {
  const goalW = Math.min(W * 0.7, 520);
  const goalH = goalW * 0.42;
  const goalX = (W - goalW) / 2;
  const goalY = H * 0.12;

  layout = {
    goalW, goalH, goalX, goalY,
    ballStartX: W / 2,
    ballStartY: H * 0.85,
    keeperW: Math.min(goalW * 0.22, 110),
    keeperH: goalH * 0.85,
  };
  game.goal.x = goalX;
  game.goal.y = goalY;
  game.goal.width = goalW;
  game.goal.height = goalH;
  game.goal.depth = goalW * 0.08;

  game.ball.x = layout.ballStartX;
  game.ball.y = layout.ballStartY;
  game.ball.z = 0;

  game.keeper.y = goalY + goalH - layout.keeperH;

  if (game.mode !== 'playing') {
    game.keeper.x = goalX + goalW / 2;
    game.keeper.targetX = game.keeper.x;
  }
}
window.addEventListener('resize', () => { resize(); computeLayout(); });

// ============ Input ============
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function onDown(e) {
  if (game.mode !== 'playing') return;
  if (game.ball.flying) return;
  e.preventDefault();
  const p = getPos(e);
  // فقط لو قريب من الكرة
  const d = Math.hypot(p.x - game.ball.x, p.y - game.ball.y);
  if (d < 130) {
    game.drag.active = true;
    game.drag.startX = game.ball.x;
    game.drag.startY = game.ball.y;
    game.drag.currentX = p.x;
    game.drag.currentY = p.y;
    document.getElementById('powerWrap').classList.add('show');
  }
}
function onMove(e) {
  if (!game.drag.active) return;
  e.preventDefault();
  const p = getPos(e);
  game.drag.currentX = p.x;
  game.drag.currentY = p.y;
  updatePower();
}
function onUp(e) {
  if (!game.drag.active) return;
  game.drag.active = false;
  document.getElementById('powerWrap').classList.remove('show');
  shoot();
}
function updatePower() {
  const dx = game.drag.currentX - game.drag.startX;
  const dy = game.drag.currentY - game.drag.startY;
  const power = Math.min(100, Math.hypot(dx, dy) / 3);
  document.getElementById('powerFill').style.width = power + '%';
}

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

// ============ Shooting ============
function shoot() {
  const dx = game.drag.currentX - game.drag.startX;
  const dy = game.drag.currentY - game.drag.startY;
  const dist = Math.hypot(dx, dy);
  if (dist < 30) return; // تجاهل السحبات الصغيرة

  // تطبيع
  const power = Math.min(1, dist / 240);
  const dirX = dx / dist;
  const dirY = dy / dist;

  // لازم السحب يكون للأمام (فوق)
  if (dirY > -0.2) return;

  sfx.kick();
  if (tg?.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('medium'); } catch(e){} }

  // تعيين سرعة الكرة
  const speed = 900 + power * 700;
  game.ball.vx = dirX * speed;
  game.ball.vy = dirY * speed;      // سالب (فوق)
  game.ball.vz = 350 + power * 350; // قوس للارتفاع
  game.ball.flying = true;
  game.ball.spin = (Math.random() - 0.5) * 8;
}

// ============ Update ============
function update(dt) {
  if (game.mode !== 'playing') return;

  // Timer
  game.timeLeft -= dt;
  if (game.timeLeft <= 0) {
    game.timeLeft = 0;
    endGame();
    return;
  }

  // Keeper movement
  const k = game.keeper;
  // اختيار هدف جديد
  if (Math.abs(k.x - k.targetX) < 15) {
    const range = 80 + game.wave * 8;
    k.targetX = game.goal.x + game.goal.width / 2 + (Math.random() - 0.5) * (game.goal.width - range);
  }
  const kDir = Math.sign(k.targetX - k.x);
  k.x += kDir * k.speed * dt;
  if (Math.abs(k.x - k.targetX) < 5) k.x = k.targetX;

  // Ball physics
  const b = game.ball;
  if (b.flying) {
    // تحديث الموقع
    const prevY = b.y;
    const prevZ = b.z;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;

    // Gravity على z (ارتفاع)
    b.vz -= 800 * dt;

    // Spin (curve)
    b.x += b.spin * dt;

    // تصادم مع الحارس
    if (b.y < game.goal.y + game.goal.height && b.y > game.goal.y - 40 && b.z < layout.keeperH) {
      const kx = k.x;
      const kw = layout.keeperW / 2;
      if (b.x > kx - kw && b.x < kx + kw) {
        // الحارس صدّها
        sfx.save();
        b.vy *= -0.4;
        b.vx += (Math.random() - 0.5) * 400;
        b.vz = 300;
        spawnFloatingText('صدّها!', '#ef4444');
        game.streak = 0;
        updateStreak();
        game.shake = 10;
        // ركلها بعيد
        setTimeout(() => resetBall(), 800);
        b.flying = false;
        return;
      }
    }

    // تصادم مع العارضة أو القوائم
    const goalLeft = game.goal.x;
    const goalRight = game.goal.x + game.goal.width;
    const goalTop = game.goal.y;
    const goalBottom = game.goal.y + game.goal.height;

    // اصطدام بالعارضة العلوية
    if (b.y < goalTop + 8 && b.y > goalTop - 8 && b.x > goalLeft && b.x < goalRight && prevZ < goalTop && b.z >= goalTop) {
      // فوق المرمى
      if (b.y < goalTop) {
        // دخل المرمى فعلاً
      }
    }

    // هل دخل المرمى؟
    if (b.y < goalTop && b.y > goalTop - 60) {
      // داخل منطقة المرمى
      if (b.x > goalLeft + 10 && b.x < goalRight - 10) {
        // هدف!
        scoreGoal();
        return;
      } else if ((b.x > goalLeft - 15 && b.x < goalLeft + 15) || (b.x > goalRight - 15 && b.x < goalRight + 15)) {
        // ضرب القائم
        sfx.post();
        b.vx *= -0.5;
        b.vy *= -0.3;
        game.shake = 8;
        spawnFloatingText('القائم!', '#f5c518');
        game.streak = 0;
        updateStreak();
        setTimeout(() => resetBall(), 900);
        b.flying = false;
        return;
      }
    }

    // خرجت من الشاشة أو سقطت على الأرض
    if (b.y < -50 || b.x < -50 || b.x > W + 50 || b.z < -30) {
      missGoal();
    }
  }

  // Particles
  updateParticles(dt);
  updateFloatingTexts(dt);

  // Shake
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
  // Goal flash
  if (game.goalAnim > 0) game.goalAnim -= dt;
}

function scoreGoal() {
  sfx.goal();
  if (tg?.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }

  game.score++;
  game.streak++;
  if (game.streak > game.maxStreak) game.maxStreak = game.streak;

  // مستوى جديد
  if (game.score % 5 === 0) {
    game.wave++;
    game.keeper.speed = 180 + (game.wave - 1) * 40;
    sfx.levelUp();
    spawnFloatingText('موجة ' + game.wave + '!', '#f5c518', 1.5);
  } else {
    sfx.streak();
    spawnFloatingText('هدف!', '#4ade80');
  }

  // تأثير
  game.shake = 14;
  game.goalAnim = 0.7;
  document.getElementById('goalFlash').classList.add('show');
  setTimeout(() => document.getElementById('goalFlash').classList.remove('show'), 700);

  // جزيئات
  spawnGoalParticles();

  updateHUD();
  updateStreak();

  game.ball.flying = false;
  setTimeout(resetBall, 900);
}

function missGoal() {
  sfx.miss();
  game.streak = 0;
  updateStreak();
  spawnFloatingText('خارج!', '#ef4444');
  game.ball.flying = false;
  setTimeout(resetBall, 800);
}

function resetBall() {
  if (game.mode !== 'playing') return;
  game.ball.x = layout.ballStartX;
  game.ball.y = layout.ballStartY;
  game.ball.z = 0;
  game.ball.vx = 0;
  game.ball.vy = 0;
  game.ball.vz = 0;
  game.ball.flying = false;
  game.ball.spin = 0;
}

// ============ Particles ============
function spawnGoalParticles() {
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 100 + Math.random() * 250;
    game.particles.push({
      x: game.ball.x,
      y: game.goal.y + game.goal.height * 0.5,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 100,
      life: 1.2, maxLife: 1.2,
      color: ['#f5c518', '#4ade80', '#ffffff'][Math.floor(Math.random() * 3)],
      size: 4 + Math.random() * 6,
    });
  }
}
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    p.vx *= 0.97;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

// ============ Floating Texts ============
function spawnFloatingText(text, color, scale) {
  game.floatingTexts.push({
    text, color: color || '#fff',
    x: W / 2, y: H * 0.45,
    life: 1.5, maxLife: 1.5,
    scale: scale || 1,
  });
}
function updateFloatingTexts(dt) {
  for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
    const t = game.floatingTexts[i];
    t.y -= 60 * dt;
    t.life -= dt;
    if (t.life <= 0) game.floatingTexts.splice(i, 1);
  }
}

// ============ Render ============
function render() {
  const shX = game.shake > 0 ? (Math.random() - 0.5) * game.shake : 0;
  const shY = game.shake > 0 ? (Math.random() - 0.5) * game.shake : 0;
  ctx.save();
  ctx.translate(shX, shY);

  drawSky();
  drawField();
  drawGoal();
  drawKeeper();
  drawBall();
  drawParticles();
  drawFloatingTexts();
  drawAimLine();

  ctx.restore();
}

function drawSky() {
  // خلفية الملعب: سماء + أدراج
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.15);
  g.addColorStop(0, '#0a1a10');
  g.addColorStop(1, '#14281c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.15);

  // مدرجات مبسطة
  for (let i = 0; i < 6; i++) {
    const y = H * 0.02 + i * (H * 0.02);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(20,40,28,0.7)' : 'rgba(30,50,35,0.7)';
    ctx.fillRect(0, y, W, H * 0.02);
  }

  // جمهور (نقاط ملونة)
  for (let i = 0; i < 80; i++) {
    const x = (i * 37 + 13) % W;
    const y = H * 0.02 + ((i * 17) % 5) * (H * 0.02);
    const colors = ['#c87a2a', '#2a6a8a', '#7a2a6a', '#6a7a2a', '#2a8a6a'];
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(x, y, 3, 3);
  }
}

function drawField() {
  // ملعب أخضر بمنظور (شبه منحرف)
  const horizonY = H * 0.15;
  const bottomY = H;
  const topLeftX = W * 0.08;
  const topRightX = W * 0.92;

  const g = ctx.createLinearGradient(0, horizonY, 0, bottomY);
  g.addColorStop(0, '#1a4d28');
  g.addColorStop(0.5, '#1e6b34');
  g.addColorStop(1, '#258040');
  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(topLeftX, horizonY);
  ctx.lineTo(topRightX, horizonY);
  ctx.lineTo(W, bottomY);
  ctx.lineTo(0, bottomY);
  ctx.closePath();
  ctx.fill();

  // خطوط العشب (شرائط)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(topLeftX, horizonY);
  ctx.lineTo(topRightX, horizonY);
  ctx.lineTo(W, bottomY);
  ctx.lineTo(0, bottomY);
  ctx.closePath();
  ctx.clip();

  for (let i = 0; i < 12; i++) {
    const t1 = i / 12;
    const t2 = (i + 1) / 12;
    const y1 = horizonY + (bottomY - horizonY) * t1;
    const y2 = horizonY + (bottomY - horizonY) * t2;
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(0, y1, W, y2 - y1);
    }
  }
  ctx.restore();

  // حدود منطقة الجزاء
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;

  // خط المرمى
  ctx.beginPath();
  const goalLineY = game.goal.y + game.goal.height + 20;
  ctx.moveTo(W * 0.15, goalLineY);
  ctx.lineTo(W * 0.85, goalLineY);
  ctx.stroke();

  // خط منطقة الجزاء
  const penaltyY = H * 0.55;
  ctx.beginPath();
  ctx.moveTo(W * 0.05, penaltyY);
  ctx.lineTo(W * 0.95, penaltyY);
  ctx.stroke();
}

function drawGoal() {
  const gx = game.goal.x, gy = game.goal.y;
  const gw = game.goal.width, gh = game.goal.height;

  // شبكة المرمى (الخلفية)
  ctx.fillStyle = 'rgba(10,30,20,0.85)';
  ctx.fillRect(gx, gy, gw, gh);

  // خطوط الشبكة
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  const cellSize = 22;
  for (let x = gx; x <= gx + gw; x += cellSize) {
    ctx.beginPath();
    ctx.moveTo(x, gy);
    ctx.lineTo(x, gy + gh);
    ctx.stroke();
  }
  for (let y = gy; y <= gy + gh; y += cellSize) {
    ctx.beginPath();
    ctx.moveTo(gx, y);
    ctx.lineTo(gx + gw, y);
    ctx.stroke();
  }

  // قوائم وعارضة (بيضاء)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';

  // القائم الأيسر
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy + gh);
  ctx.stroke();

  // القائم الأيمن
  ctx.beginPath();
  ctx.moveTo(gx + gw, gy);
  ctx.lineTo(gx + gw, gy + gh);
  ctx.stroke();

  // العارضة العلوية
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx + gw, gy);
  ctx.stroke();

  // ظلال على القوائم
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(gx + 4, gy);
  ctx.lineTo(gx + 4, gy + gh);
  ctx.moveTo(gx + gw + 4, gy);
  ctx.lineTo(gx + gw + 4, gy + gh);
  ctx.moveTo(gx, gy + 4);
  ctx.lineTo(gx + gw, gy + 4);
  ctx.stroke();
}

function drawKeeper() {
  const k = game.keeper;
  const kw = layout.keeperW;
  const kh = layout.keeperH;
  const kx = k.x - kw / 2;
  const ky = k.y;

  // ظل
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(k.x, ky + kh + 5, kw * 0.5, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // جسم الحارس (زي أصفر/أزرق)
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.roundRect(kx + kw * 0.15, ky + kh * 0.3, kw * 0.7, kh * 0.55, 8);
  ctx.fill();

  // رأس
  ctx.fillStyle = '#e8b98a';
  ctx.beginPath();
  ctx.arc(k.x, ky + kh * 0.18, kw * 0.22, 0, Math.PI * 2);
  ctx.fill();

  // شعر
  ctx.fillStyle = '#3a2418';
  ctx.beginPath();
  ctx.arc(k.x, ky + kh * 0.13, kw * 0.22, Math.PI, 0);
  ctx.fill();

  // قفازات (ياقتان)
  ctx.fillStyle = '#1a4d8a';
  ctx.beginPath();
  ctx.arc(kx + kw * 0.05, ky + kh * 0.55, kw * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(kx + kw * 0.95, ky + kh * 0.55, kw * 0.14, 0, Math.PI * 2);
  ctx.fill();

  // شورت
  ctx.fillStyle = '#1a3d6a';
  ctx.fillRect(kx + kw * 0.2, ky + kh * 0.83, kw * 0.6, kh * 0.15);

  // عيون
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(k.x - kw * 0.08, ky + kh * 0.18, 2.5, 0, Math.PI * 2);
  ctx.arc(k.x + kw * 0.08, ky + kh * 0.18, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBall() {
  const b = game.ball;
  const screenY = b.y - b.z; // رفع الكرة حسب ارتفاعها

  // ظل
  const shadowScale = Math.max(0.3, 1 - b.z / 300);
  ctx.fillStyle = `rgba(0,0,0,${0.5 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + 8, b.radius * shadowScale, b.radius * 0.35 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // الكرة
  ctx.save();
  ctx.translate(b.x, screenY);
  ctx.rotate(b.spin * 0.3);

  // تدرج للكرة
  const g = ctx.createRadialGradient(-b.radius * 0.3, -b.radius * 0.3, 2, 0, 0, b.radius);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.6, '#f0f0f0');
  g.addColorStop(1, '#c0c0c0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
  ctx.fill();

  // خطوط الكرة (شكل كلاسيكي)
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, b.radius * 0.7, 0, Math.PI * 2);
  ctx.stroke();

  // بقع سوداء
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(0, 0, b.radius * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-b.radius * 0.5, -b.radius * 0.5, b.radius * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(b.radius * 0.5, b.radius * 0.3, b.radius * 0.18, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawAimLine() {
  if (!game.drag.active) return;

  const dx = game.drag.currentX - game.drag.startX;
  const dy = game.drag.currentY - game.drag.startY;
  const dist = Math.hypot(dx, dy);
  if (dist < 20) return;

  const b = game.ball;
  const power = Math.min(1, dist / 240);

  // نقطة التأثير
  ctx.strokeStyle = 'rgba(245,197,24,0.8)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(game.drag.currentX, game.drag.currentY);
  ctx.stroke();
  ctx.setLineDash([]);

  // دائرة القوة
  ctx.fillStyle = 'rgba(245,197,24,0.4)';
  ctx.beginPath();
  ctx.arc(game.drag.currentX, game.drag.currentY, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#f5c518';
  ctx.lineWidth = 2;
  ctx.stroke();

  // سهم الاتجاه
  const ang = Math.atan2(dy, dx);
  ctx.save();
  ctx.translate(game.drag.currentX, game.drag.currentY);
  ctx.rotate(ang);
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(-5, -6);
  ctx.lineTo(-5, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of game.particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  for (const t of game.floatingTexts) {
    const a = Math.min(1, t.life / 0.5);
    ctx.globalAlpha = a;
    ctx.font = `900 ${42 * t.scale}px "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(t.text, t.x + 3, t.y + 3);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

// ============ HUD Update ============
function updateHUD() {
  document.getElementById('scoreVal').textContent = game.score;
  document.getElementById('waveVal').textContent = game.wave;
}
function updateStreak() {
  const el = document.getElementById('streakBadge');
  const val = document.getElementById('streakVal');
  val.textContent = game.streak;
  if (game.streak >= 2) el.classList.add('show');
  else el.classList.remove('show');
}

// ============ Game Flow ============
function startGame() {
  initAudio();
  computeLayout();
  game.mode = 'playing';
  game.score = 0;
  game.wave = 1;
  game.streak = 0;
  game.maxStreak = 0;
  game.timeLeft = 60;
  game.keeper.speed = 180;
  game.keeper.x = game.goal.x + game.goal.width / 2;
  game.keeper.targetX = game.keeper.x;
  game.particles.length = 0;
  game.floatingTexts.length = 0;
  resetBall();
  updateHUD();
  updateStreak();

  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('overScreen').classList.remove('show');
  document.getElementById('powerWrap').classList.remove('show');

  // Timer
  game.lastTime = performance.now();
}

function endGame() {
  game.mode = 'over';
  document.getElementById('powerWrap').classList.remove('show');
  document.getElementById('streakBadge').classList.remove('show');

  // Best
  const isNewRecord = game.score > game.best;
  if (isNewRecord) {
    game.best = game.score;
    try { localStorage.setItem('toba_best', String(game.best)); } catch(e){}
  }

  document.getElementById('finalScore').textContent = game.score;
  document.getElementById('finalStreak').textContent = game.maxStreak;
  document.getElementById('finalWave').textContent = game.wave;
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('overScreen').classList.add('show');
}

// ============ Timer bar ============
function drawTimerBar() {
  if (game.mode !== 'playing') return;
  const w = W * 0.5, h = 8;
  const x = (W - w) / 2, y = H * 0.09;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, y, w, h);
  const ratio = game.timeLeft / 60;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  if (ratio > 0.3) {
    g.addColorStop(0, '#4ade80');
    g.addColorStop(1, '#22c55e');
  } else {
    g.addColorStop(0, '#ef4444');
    g.addColorStop(1, '#c41010');
  }
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // وقت بالثواني
  ctx.fillStyle = '#fff';
  ctx.font = '900 14px "Orbitron", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(Math.ceil(game.timeLeft) + 's', W / 2, y - 4);
}

// ============ Loop ============
let lastFrame = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!lastFrame) { lastFrame = now; return; }
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (dt > 0.1) dt = 0.1;

  update(dt);
  render();
  drawTimerBar();
}
requestAnimationFrame(loop);

// ============ Rotate warning ============
function checkRotate() {
  const isPortrait = H > W;
  const msg = document.getElementById('rotateMsg');
  if (IS_TOUCH && isPortrait && game.mode === 'menu') msg.classList.add('show');
  else msg.classList.remove('show');
}
window.addEventListener('resize', checkRotate);
window.addEventListener('orientationchange', () => setTimeout(checkRotate, 200));
setTimeout(checkRotate, 100);

// ============ Buttons ============
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ============ RoundRect polyfill ============
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ============ Prevent defaults ============
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

console.log('⚽ طوبة — جاهزة');
</script>

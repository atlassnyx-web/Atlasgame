<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS COSMOS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Consolas', 'Courier New', monospace; }
  #universe { display: block; position: absolute; top: 0; left: 0; cursor: crosshair; }

  .hud {
    position: fixed; color: #00d4ff; font-size: 12px;
    letter-spacing: 1.5px; z-index: 10; pointer-events: none;
    text-shadow: 0 0 10px #00d4ffaa;
    line-height: 1.8;
  }
  .hud.tl { top: 24px; left: 24px; }
  .hud.tr { top: 24px; right: 24px; text-align: right; }
  .hud.bl { bottom: 24px; left: 24px; }
  .hud.br { bottom: 24px; right: 24px; text-align: right; }
  .hud .label { color: #6b7280; font-size: 10px; }
  .hud .value { color: #00ff88; font-weight: bold; }
  .hud .accent { color: #7c3aed; }

  .title {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px; font-weight: 900;
    letter-spacing: 40px;
    background: linear-gradient(90deg, #00d4ff, #7c3aed, #00ff88);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    z-index: 3; pointer-events: none;
    opacity: 0.06; user-select: none;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.04; letter-spacing: 40px; }
    50% { opacity: 0.10; letter-spacing: 50px; }
  }

  .corner {
    position: fixed; width: 28px; height: 28px;
    border: 2px solid #00d4ff; z-index: 10;
    pointer-events: none; opacity: 0.4;
    animation: cornerPulse 3s ease-in-out infinite;
  }
  @keyframes cornerPulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

  .scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00d4ff, transparent);
    z-index: 20; pointer-events: none;
    animation: scan 8s linear infinite;
    opacity: 0.3;
  }
  @keyframes scan { 0%{transform:translateY(0)} 100%{transform:translateY(100vh)} }
</style>
</head>
<body>
<canvas id="universe"></canvas>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="scanline"></div>
<div class="title">ATLAS</div>

<div class="hud tl">
  <div><span class="label">SYSTEM</span> <span class="value">ONLINE</span></div>
  <div><span class="label">FPS</span> <span class="value" id="fps">60</span></div>
  <div><span class="label">STARS</span> <span class="value" id="stars">800</span></div>
  <div><span class="label">WARP</span> <span class="value" id="warp">0.0</span></div>
</div>

<div class="hud tr">
  <div><span class="label">TIME</span> <span class="value" id="time">--:--:--</span></div>
  <div><span class="label">DATE</span> <span class="value" id="date">--/--/--</span></div>
  <div><span class="label">SECTOR</span> <span class="value">ALPHA-01</span></div>
</div>

<div class="hud bl">
  <div><span class="accent">►</span> <span class="label">MOVE MOUSE TO NAVIGATE</span></div>
  <div><span class="accent">►</span> <span class="label">CLICK TO WARP BURST</span></div>
  <div><span class="accent">►</span> <span class="label">SCROLL TO CHANGE SPEED</span></div>
</div>

<div class="hud br">
  <div><span class="label">© 2024</span> <span class="value">ATLAS</span></div>
  <div><span class="label">COSMOS ENGINE v1.0</span></div>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, cx = 0, cy = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);

  // ============================================================
  //                        STARS
  // ============================================================
  const STARS_COUNT = 900;
  const stars = [];

  function starColor() {
    const r = Math.random();
    if (r < 0.68) return '#ffffff';
    if (r < 0.85) return '#a8c8ff';
    if (r < 0.95) return '#ffe4a8';
    return '#ffb8e8';
  }

  function makeStar(initial) {
    return {
      x: (Math.random() - 0.5) * 2400,
      y: (Math.random() - 0.5) * 2400,
      z: initial ? Math.random() * 2000 + 1 : 2000,
      size: Math.random() * 1.6 + 0.4,
      color: starColor()
    };
  }

  for (let i = 0; i < STARS_COUNT; i++) stars.push(makeStar(true));

  // ============================================================
  //                        PARTICLES
  // ============================================================
  const particles = [];

  function spawn(x, y, burst) {
    const n = burst ? 60 : 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = burst ? Math.random() * 8 + 2 : Math.random() * 1.2 + 0.3;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: 1,
        decay: burst ? 0.012 : 0.035,
        size: burst ? Math.random() * 3 + 1 : Math.random() * 1.8 + 0.4,
        color: burst
          ? (Math.random() < 0.5 ? '#00d4ff' : '#7c3aed')
          : '#00ff88'
      });
    }
    if (particles.length > 800) particles.splice(0, particles.length - 800);
  }

  // ============================================================
  //                        INPUT
  // ============================================================
  let mouseX = 0, mouseY = 0;
  let targetVX = 0, targetVY = 0;
  let vx = 0, vy = 0;
  let speed = 3;

  window.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    targetVX = (e.clientX - cx) / cx;
    targetVY = (e.clientY - cy) / cy;
    spawn(e.clientX, e.clientY, false);
  });

  window.addEventListener('click', function(e) {
    spawn(e.clientX, e.clientY, true);
    for (let deg = 0; deg < 360; deg += 6) {
      const a = deg * Math.PI / 180;
      particles.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(a) * 14,
        vy: Math.sin(a) * 14,
        life: 1, decay: 0.018,
        size: 1.8, color: '#00d4ff'
      });
    }
  });

  window.addEventListener('touchmove', function(e) {
    const t = e.touches[0];
    targetVX = (t.clientX - cx) / cx;
    targetVY = (t.clientY - cy) / cy;
    spawn(t.clientX, t.clientY, false);
  }, { passive: true });

  window.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    spawn(t.clientX, t.clientY, true);
  }, { passive: true });

  window.addEventListener('wheel', function(e) {
    speed += e.deltaY * -0.008;
    speed = Math.max(0.3, Math.min(25, speed));
  }, { passive: true });

  // ============================================================
  //                     WIREFRAME SPHERE
  // ============================================================
  const sphere = {
    r: 130,
    seg: 22,
    rx: 0, ry: 0, rz: 0
  };

  function project(x, y, z) {
    // Rotate X
    const cosX = Math.cos(sphere.rx), sinX = Math.sin(sphere.rx);
    const y1 = y * cosX - z * sinX;
    const z1 = y * sinX + z * cosX;
    // Rotate Y
    const cosY = Math.cos(sphere.ry), sinY = Math.sin(sphere.ry);
    const x2 = x * cosY + z1 * sinY;
    const z2 = -x * sinY + z1 * cosY;
    // Rotate Z
    const cosZ = Math.cos(sphere.rz), sinZ = Math.sin(sphere.rz);
    const x3 = x2 * cosZ - y1 * sinZ;
    const y3 = x2 * sinZ + y1 * cosZ;

    const persp = 520;
    const sc = persp / (persp + z2);
    return { x: x3 * sc, y: y3 * sc, z: z2 };
  }

  function drawSphere() {
    ctx.save();
    ctx.translate(cx, cy);

    sphere.ry += 0.006;
    sphere.rx += 0.0025;
    sphere.rz += 0.0035;

    // Glow
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, sphere.r * 2.2);
    g.addColorStop(0, 'rgba(0, 212, 255, 0.14)');
    g.addColorStop(0.5, 'rgba(124, 58, 237, 0.06)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, sphere.r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    const seg = sphere.seg;
    ctx.lineWidth = 0.8;

    // Latitude lines
    for (let i = 1; i < seg; i++) {
      const phi = (i / seg) * Math.PI;
      const r = sphere.r * Math.sin(phi);
      const y = sphere.r * Math.cos(phi);

      ctx.beginPath();
      for (let j = 0; j <= seg; j++) {
        const theta = (j / seg) * Math.PI * 2;
        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta);
        const p = project(x, y, z);
        if (j === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.30)';
      ctx.stroke();
    }

    // Longitude lines
    for (let i = 0; i < seg; i++) {
      const theta = (i / seg) * Math.PI * 2;

      ctx.beginPath();
      for (let j = 0; j <= seg; j++) {
        const phi = (j / seg) * Math.PI;
        const r = sphere.r * Math.sin(phi);
        const y = sphere.r * Math.cos(phi);
        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta);
        const p = project(x, y, z);
        if (j === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = 'rgba(124, 58, 237, 0.30)';
      ctx.stroke();
    }

    // Center core
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#00d4ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 25;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // ============================================================
  //                     DRAW STARS
  // ============================================================
  function drawStars() {
    vx += (targetVX - vx) * 0.04;
    vy += (targetVY - vy) * 0.04;

    const offX = vx * 320;
    const offY = vy * 320;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.z -= speed;

      if (s.z <= 1) {
        stars[i] = makeStar(false);
        continue;
      }

      const k = 500 / s.z;
      const sx = cx + (s.x + offX) * k;
      const sy = cy + (s.y + offY) * k;

      if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;

      const size = Math.max(0.3, s.size * k * 0.6);
      const alpha = Math.min(1, (1 - s.z / 2000) * 1.4);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;

      // Draw trail lines for close stars
      if (s.z < 200 && speed > 2) {
        const prevK = 500 / (s.z + speed * 3);
        const px = cx + (s.x + offX) * prevK;
        const py = cy + (s.y + offY) * prevK;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  //                     DRAW PARTICLES
  // ============================================================
  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.965;
      p.vy *= 0.965;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // ============================================================
  //                        MAIN LOOP
  // ============================================================
  let last = performance.now();
  let frames = 0;
  let fpsAcc = 0;

  function loop(now) {
    const dt = now - last;
    last = now;

    // Fade trail
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(0, 0, W, H);

    drawStars();
    drawSphere();
    drawParticles();

    // FPS
    frames++;
    fpsAcc += dt;
    if (fpsAcc >= 500) {
      document.getElementById('fps').textContent = Math.round((frames * 1000) / fpsAcc);
      frames = 0;
      fpsAcc = 0;
    }

    document.getElementById('warp').textContent = speed.toFixed(1);

    requestAnimationFrame(loop);
  }

  // ============================================================
  //                        CLOCK
  // ============================================================
  function tick() {
    const d = new Date();
    const pad = function(n) { return String(n).padStart(2, '0'); };
    document.getElementById('time').textContent =
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('date').textContent =
      pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  tick();
  setInterval(tick, 1000);

  // ============================================================
  //                        BOOT
  // ============================================================
  console.log('%c⬢ ATLAS COSMOS v1.0', 'font-size:22px;font-weight:900;color:#00d4ff;text-shadow:0 0 20px #00d4ff;');
  console.log('%cMove mouse → fly  |  Click → warp burst  |  Scroll → speed', 'color:#00ff88;font-size:13px;');
  console.log('%c© 2024 ATLAS', 'color:#6b7280;font-size:11px;');

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
